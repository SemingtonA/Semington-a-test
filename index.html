    }

/* ===== FOOTER ===== */
.site-footer {
  position: relative;
  background-color: #f5f0e6;
  padding: 10px 15px;
  font-size: 12px;
}

/* True page centre */
.footer-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

/* Centre content */
.footer-copyright {
  font-size: 12px;
}

.footer-logo {
  height: 32px;
  width: auto;
}

/* Bottom-right logo ONLY */
.footer-published {
  display: flex;
  justify-content: flex-end;
}


.published-logo {
  height: 24px;
  width: auto;
  display: block;
  opacity: 0.85;
}

/* Mobile */
@media (max-width: 600px) {
  .footer-center {
    position: static;
    transform: none;
    margin-bottom: 6px;
  }

  .footer-published {
    justify-content: center;
  }

  .footer-logo {
    height: 28px;
  }

  .published-logo {
    height: 22px;
  }
}
