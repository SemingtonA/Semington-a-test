<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semington A Skittles Team</title>

  <style>
    /* ===== BASE ===== */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      padding: 20px;
    }

    .logo img {
      width: 280px;
      height: auto;
    }

    header h1 {
      margin: 10px 0 20px;
      font-size: 72px;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    .centre-image img {
      width: 600px;
      max-width: 100%;
      height: auto;
      margin: 40px 0;
    }

    /* ===== FOOTER ===== */
    footer {
      position: relative;
      background-color: #f5f0e6;
      padding: 10px 15px;
      font-size: 12px;
    }

    /* Centre footer content */
    .footer-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .footer-center img {
      height: 32px;
      width: auto;
    }

    /* Bottom-right logo */
    .footer-published {
      display: flex;
      justify-content: flex-end;
    }

    .footer-published img {
      height: 24px;
      width: auto;
      opacity: 0.85;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      .footer-center {
        position: static;
        transform: none;
        margin-bottom: 6px;
      }

      .footer-published {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>

  <h1>Semington A Skittles Team</h1>

  <div class="nav-buttons">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures & Results</a>
    <a href="match-results-v2.html">Match Results</a>
    <a href="tocatch.html">To Catch</a>
    <a href="gallery.html">Gallery</a>
    <a href="rules.html">Rules</a>
  </div>
</header>

<main>
  <div class="centre-image">
    <img src="Skittles Clipart 2.jpg" alt="Skittles">
  </div>

  <h2>Join Us</h2>
  <p>
    We’re always looking for new players, supporters,<br>
    and anyone who can count to nine under pressure.
  </p>
</main>

<footer>
  <div class="footer-center">
    <span>© Semington A Skittles Team</span>
    <img src="Semington A Logo 5.jpg" alt="">
  </div>

  <div class="footer-published">
    <img src="published-logo.png" alt="">
  </div>
</footer>

</body>
</html>
