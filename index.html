<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semington A Skittles Team</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
      color: #333;
    }

    /* ===== HEADER ===== */
    header {
      padding: 20px;
      text-align: center;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 10px 0;
      font-size: 48px;
    }

    .logo img {
      width: 280px;
      max-width: 100%;
      height: auto;
    }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover {
      background: #163aa3;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      text-align: center;
      flex: 1;
    }

    .centre-image {
      display: flex;
      justify-content: center;
      margin: 40px 0;
    }

    .centre-image img {
      width: 600px;
      max-width: 100%;
      height: auto;
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 16px 20px 22px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img {
      width: 60px;
      height: auto;
      margin-top: 6px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      header h1 {
        font-size: 32px;
      }

      .logo img {
        width: 150px;
      }

      .footer-logo img {
        width: 48px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-top">
      <div class="logo">
        <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
      </div>

      <h1>Semington A Skittles Team</h1>
    </div>

    <div class="nav-buttons">
      <a href="/semington-a/index.html">Home</a>
      <a href="/semington-a/fixtures.html">Fixtures &amp; Results</a>
      <a href="/semington-a/match-results.html">Match Results</a>
      <a href="/semington-a/tocatch.html">To Catch</a>
      <a href="/semington-a/gallery.html">Gallery</a>
      <a href="/semington-a/rules.html">Rules</a>
    </div>
  </header>

  <div class="main-content">

    <div class="centre-image">
      <img src="Skittles Clipart 2.jpg" alt="Skittles">
    </div>

    <div class="join-us">
      <h2>Join Us</h2>
      <p>
        We’re always looking for new players, supporters,<br>
        and anyone who can count to nine under pressure.
      </p>
    </div>

  </div>

  <footer>
    © Semington A Skittles Team
    <div class="footer-logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </footer>

</body>
</html>
