<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semington A Skittles Team</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      padding: 20px;
    }

    .logo img {
      width: 280px;
      height: auto;
    }

    header h1 {
      margin: 10px 0 20px 0;
      font-size: 72px;
    }

    /* Nav buttons */
    .nav-buttons {
      text-align: center;
      margin-bottom: 20px;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover {
      background: #163aa3;
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    .centre-image img {
      width: 600px;
      max-width: 100%;
      height: auto;
      margin: 40px 0;
    }

    /* ===== FOOTER ===== */
    footer.site-footer {
      background-color: #f5f0e6;
      padding: 10px 15px;
      font-size: 12px;
    }

    .footer-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    /* Bottom centre: copyright + main logo */
    .footer-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .footer-logo {
      height: 32px;
      width: auto;
    }

    /* Bottom right: published by */
    .footer-published {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }

    .published-logo {
      height: 24px;
      width: auto;
      opacity: 0.85;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      header h1 {
        font-size: 32px;
      }

      .logo img {
        width: 150px;
      }
    }

    @media (max-width: 600px) {
      .footer-inner {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .footer-center,
      .footer-published {
        justify-content: center;
      }

      .footer-logo {
        height: 28px;
      }

      .published-logo {
        height: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>

    <h1>Semington A Skittles Team</h1>

    <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures &amp; Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="centre-image">
      <img src="Skittles Clipart 2.jpg" alt="Skittles">
    </div>

    <div class="join-us">
      <h2>Join Us</h2>
      <p>
        We’re always looking for new players, supporters,<br>
        and anyone who can count to nine under pressure.
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">

      <div class="footer-center">
        <span>© Semington A Skittles Team</span>
        <img src="Semington A Logo 5.jpg"
             class="footer-logo"
             alt="Semington A Skittles Team">
      </div>

      <div class="footer-published">
        <span>Published by</span>
        <img src="Published By Logo.jpg"
             class="published-logo"
             alt="Published by">
      </div>

    </div>
  </footer>

</body>
</html>
