
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semington A Skittles Team</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      padding: 20px;
    }

    .logo img {
      width: 280px;
      height: auto;
    }

    header h1 {
      margin: 10px 0 20px;
      font-size: 72px;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover {
      background: #163aa3;
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    .centre-image img {
      width: 600px;
      max-width: 100%;
      height: auto;
      margin: 40px 0;
    }

    /* ===== FOOTER ===== */
    footer {
      background-color: #f5f0e6;
      padding: 15px;
      font-size: 12px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    /* Centre footer content */
    .footer-center {
      grid-column: 2;
      text-align: center;
    }

    .footer-center img {
      height: 32px;
      display: block;
      margin: 4px auto 0;
    }

    /* Right footer logo */
    .footer-published {
      grid-column: 3;
      display: flex;
      justify-content: flex-end;
    }

    .footer-published img {
      height: 24px;
      opacity: 0.85;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }

      .logo img {
        width: 150px;
      }

      footer {
        grid-template-columns: 1fr;
        row-gap: 10px;
        text-align: center;
      }

      .footer-published {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Skittles Team Logo">
    </div>

    <h1>Semington A Skittles Team</h1>

    <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="centre-image">
      <img src="Skittles Clipart 2.jpg" alt="Skittles">
    </div>

    <h2>Join Us</h2>
    <p>
      We’re always looking for new players, supporters,<br>
      and anyone who can count to nine under pressure.
    </p>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-center">
      © Semington A Skittles Team
      <img src="Semington A Logo 5.jpg" alt="">
    </div>

    <div class="footer-published">
      <img src="published-logo.png" alt="">
    </div>
  </footer>

</body>
</html>
