
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons { margin-top: 15px; text-align: center; }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .panel {
      max-width: 1400px;
      margin: 10px auto 14px;
      background: #ffffffcc;
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #status {
      margin-top: 8px;
      font-size: 15px;
      color: #555;
    }

    .table-wrap {
      max-width: 1400px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    th {
      border-bottom: 1px solid #eee;
      padding: 8px;
      white-space: normal;
      text-align: center;
      background: #fafafa;
      font-weight: bold;
    }

    td {
      border-bottom: 1px solid #eee;
      padding: 8px;
      white-space: nowrap;
      text-align: center;
      font-weight: bold;
    }

    /* Left align Match ID + Team Player */
    td:nth-child(1), th:nth-child(1),
    td:nth-child(4), th:nth-child(4) {
      text-align: left;
    }

    /* Position column – dark green text (col 6) */
    .table-wrap td:nth-child(6) {
      color: #0b5e20;
      font-weight: bold;
    }

    /* Position #1 – standout highlight (added via JS class) */
    .table-wrap td.pos-1 {
      background: #1eaa52;
      color: #fff;
      border-radius: 4px;
      text-align: center;
    }

    /* Away placeholder in Total Score cell */
    .table-wrap td.away-total {
      background: #000;
      color: #fff;
      border-radius: 4px;
      text-align: center;
    }

    /* ===== FOOTER ===== */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px 20px 22px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; opacity: 0.9; }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; margin-bottom: 10px; }
      table { font-size: 12px; }
      .footer-logo img { width: 48px; }
    }
  </style>
</head>

<body>
<header>
  <div class="header-top">
    <h1>Match Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>

  <div class="nav-buttons">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures &amp; Results</a>
    <a href="match-results.html">Match Results</a>
    <a href="tocatch.html">To Catch</a>
    <a href="gallery.html">Gallery</a>
    <a href="rules.html">Rules</a>
  </div>
</header>

<main>
  <div class="panel">
    <div class="label">Filter by Match ID</div>
    <select id="matchSelect">
      <option value="">All Matches</option>
    </select>
    <div id="status"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Match ID</th>
          <th>Match Details</th>
          <th>Home or Away</th>
          <th>Team Player</th>
          <th>Total Score</th>
          <th>Position<br>to be Dropped 10–1</th>
          <th>Ducks</th>
          <th>Spares</th>
          <th>Legs Won</th>
          <th>Top Score</th>
          <th>League Avg</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>

<script>
(function () {
  const tbody  = document.getElementById("tableBody");
  const select = document.getElementById("matchSelect");
  const status = document.getElementById("status");

  function clean(h) { return String(h || "").trim().replace(/:$/, ""); }
  function hz(v) {
    v = (v === undefined || v === null) ? "" : String(v).trim();
    return (v === "" || v === "0" || v === "0.00") ? "" : v;
  }
  function toNum(v) {
    const n = Number(String(v === undefined ? "" : v).trim());
    return Number.isFinite(n) ? n : NaN;
  }
  function pound(v) {
    const t = hz(v);
    return t ? ("£" + t) : "";
  }
  function isLeague(details) { return /league/i.test(details || ""); }
  function dateFromMatchId(id) {
    const m = String(id || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  }
  function parseCSV(text) {
    // Simple CSV parsing (matches your existing file style)
    return text.replace(/^\uFEFF/, "").trim().split(/\r?\n/).map(line => line.split(","));
  }

  function rowHtml(r) {
    let scoreCell = hz(r.score);
    if (r.absent) scoreCell = (r.player === "A N Other") ? "" : "Away";

    const scoreTdClass = (scoreCell === "Away") ? ' class="away-total"' : "";
    const posClass = (String(r.position || "") === "1") ? ' class="pos-1"' : "";

    return "<tr>" +
      "<td>" + (r.matchId || "") + "</td>" +
      "<td>" + (r.details || "") + "</td>" +
      "<td>" + (r.homeAway || "") + "</td>" +
      "<td>" + (r.player || "") + "</td>" +
      "<td" + scoreTdClass + ">" + scoreCell + "</td>" +
      "<td" + posClass + ">" + (r.position || "") + "</td>" +
      "<td>" + hz(r.ducks) + "</td>" +
      "<td>" + hz(r.spares) + "</td>" +
      "<td>" + pound(r.legsWon) + "</td>" +
      "<td>" + pound(r.top) + "</td>" +
      "<td>" + (r.avg || "") + "</td>" +
    "</tr>";
  }

  fetch("match_results.csv", { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error("match_results.csv not found");
      return r.text();
    })
    .then(text => {
      const grid = parseCSV(text);

      // find header row containing "Match ID"
      let headerIndex = -1;
      for (let i = 0; i < grid.length; i++) {
        for (let j = 0; j < grid[i].length; j++) {
          if (clean(grid[i][j]) === "Match ID") { headerIndex = i; break; }
        }
        if (headerIndex !== -1) break;
      }
      if (headerIndex === -1) throw new Error('Header row not found (expected "Match ID")');

      const headers = grid[headerIndex].map(clean);
      const rows = grid.slice(headerIndex + 1);

      // normalized data rows
      const data = [];
      for (let i = 0; i < rows.length; i++) {
        const o = {};
        for (let j = 0; j < headers.length; j++) o[headers[j]] = (rows[i][j] || "").trim();
        if (!o["Match ID"] || !o["Team Player"]) continue;

        data.push({
          matchId:  o["Match ID"],
          details:  o["Match Details"],
          homeAway: o["Home or Away"],
          player:   o["Team Player"],
          score:    o["Total Score"],
          ducks:    o["Ducks"],
          spares:   o["Spares"],
          legsWon:  o["Legs Won"],
          top:      o["Top Score"],
          avg:      (o["League Averages"] || o["League Avg"] || "")
        });
      }

      // roster (for per-match absent listing)
      const rosterMap = {};
      data.forEach(r => { if (r.player && r.player !== "Away") rosterMap[r.player] = true; });
      rosterMap["A N Other"] = true;
      const roster = Object.keys(rosterMap).sort((a, b) => a.localeCompare(b));

      // group by match
      const matchRows = {};
      const byPlayer = {};
      data.forEach(rr => {
        if (!matchRows[rr.matchId]) matchRows[rr.matchId] = [];
        matchRows[rr.matchId].push(rr);
        if (!byPlayer[rr.matchId]) byPlayer[rr.matchId] = {};
        byPlayer[rr.matchId][rr.player] = rr;
      });

      // match IDs newest first
      const matchIds = Object.keys(matchRows);
      matchIds.sort((a, b) => {
        const da = dateFromMatchId(a);
        const db = dateFromMatchId(b);
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return db - da;
      });

      // populate dropdown
      while (select.options.length > 1) select.remove(1);
      matchIds.forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      });

      function render(matchId) {
        tbody.innerHTML = "";

        // All matches view: just show recorded rows, no absent expansion, no position calc
        if (!matchId) {
          let html = "";
          matchIds.forEach(id => {
            const block = matchRows[id] || [];
            block.forEach(x => html += rowHtml({ ...x, absent: false, position: "" }));
          });
          tbody.innerHTML = html;
          status.textContent = "Loaded " + data.length + " rows. Matches: " + matchIds.length + ".";
          return;
        }

        // Single match view: expand roster so absents show as Away
        const map = byPlayer[matchId];
        if (!map) return;

        const raw = matchRows[matchId] || [];
        const firstRow = raw[0] || { details: "", homeAway: "" };

        const expanded = [];
        roster.forEach(name => {
          const ex = map[name];
          if (ex) {
            expanded.push({ ...ex, absent: false, position: "" });
          } else {
            expanded.push({
              matchId: matchId,
              details: firstRow.details,
              homeAway: firstRow.homeAway,
              player: name,
              score: "",
              ducks: "",
              spares: "",
              legsWon: "",
              top: "",
              avg: "",
              absent: true,
              position: ""
            });
          }
        });

        // positions ONLY for league matches
        if (isLeague(firstRow.details)) {
          const played = expanded
            .filter(r => r.player !== "A N Other" && !r.absent && Number.isFinite(toNum(r.score)) && toNum(r.score) > 0)
            .sort((a, b) => toNum(b.score) - toNum(a.score));

          played.forEach((r, idx) => { r.position = String(idx + 1); });

          // ensure non-played/absent/A N Other have blank position
          expanded.forEach(r => {
            const sc = toNum(r.score);
            if (!(r.player !== "A N Other" && Number.isFinite(sc) && sc > 0)) r.position = "";
          });
        }

        // render in roster order (stable)
        let out = "";
        expanded.forEach(r => out += rowHtml(r));
        tbody.innerHTML = out;

        status.textContent = "Loaded " + raw.length + " rows for " + matchId + ".";
      }

      render("");
      select.addEventListener("change", () => render(select.value));
    })
    .catch(e => {
      status.style.color = "red";
      status.textContent = e.message;
      tbody.innerHTML = "";
    });
})();
</script>

</body>
</html>
