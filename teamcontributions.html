<!-- ===== SEASON DROPDOWN BAR (AUTO-WIDTH) ===== -->

<script>
// ===============================
// LOAD CSV AND INITIALISE PAGE
// ===============================

let csvData = [];
let seasons = [];

// Load CSV file
fetch("playerdata.csv")
    .then(response => response.text())
    .then(text => {
        csvData = parseCSV(text);
        extractSeasons();
        populateSeasonDropdown();
        applySeasonFilter(); // Auto-load most recent season
    });

// ===============================
// PARSE CSV INTO ARRAY OF OBJECTS
// ===============================
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",");

    return lines.slice(1).map(line => {
        const values = line.split(",");
        let row = {};
        headers.forEach((h, i) => row[h.trim()] = values[i]?.trim());
        return row;
    });
}

// ===============================
// EXTRACT UNIQUE SEASONS
// ===============================
function extractSeasons() {
    const seasonSet = new Set();

    csvData.forEach(row => {
        if (row["Season"] && row["Season"] !== "") {
            seasonSet.add(row["Season"]);
        }
    });

    seasons = Array.from(seasonSet);

    // Sort seasons newest → oldest
    seasons.sort((a, b) => {
        const aYear = parseInt(a.split("-")[0]);
        const bYear = parseInt(b.split("-")[0]);
        return bYear - aYear;
    });
}

// ===============================
// POPULATE SEASON DROPDOWN
// ===============================
function populateSeasonDropdown() {
    const dropdown = document.getElementById("seasonSelect");
    dropdown.innerHTML = "";

    seasons.forEach(season => {
        const option = document.createElement("option");
        option.value = season;
        option.textContent = season;
        dropdown.appendChild(option);
    });

    // Auto-select most recent season
    if (seasons.length > 0) {
        dropdown.value = seasons[0];
    }

    dropdown.addEventListener("change", applySeasonFilter);
}

// ===============================
// FILTER DATA BY SELECTED SEASON
// ===============================
function applySeasonFilter() {
    const selectedSeason = document.getElementById("seasonSelect").value;

    const filtered = csvData.filter(row => row["Season"] === selectedSeason);

    buildContributionsTable(filtered);
}
</script>

 <script>
// =====================================
// BUILD CONTRIBUTIONS TABLE (MAIN VIEW)
// =====================================
function buildContributionsTable(rows) {

    // Group rows by player
    const players = {};
    rows.forEach(r => {
        const name = r["Player"];
        if (!players[name]) players[name] = [];
        players[name].push(r);
    });

    // Start building table HTML
    let html = `
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Legs Won (£)</th>
                    <th>Spares (£)</th>
                    <th>Top Score (£)</th>
                    <th>Duck Fines (£)</th>
                    <th>Leg Fines (£)</th>
                    <th>League Fees (£)</th>
                    <th>Cup Fees (£)</th>
                    <th>Leg Fees (£)</th>
                    <th>Net Owed (£)</th>
                </tr>
            </thead>
            <tbody>
    `;

    // Totals accumulator
    let totals = {
        legsWon: 0,
        spares: 0,
        topScore: 0,
        duckFines: 0,
        legFines: 0,
        leagueFees: 0,
        cupFees: 0,
        legFees: 0,
        netOwed: 0
    };

    // Build each player row
    for (const player in players) {
        const data = calculatePlayerTotals(players[player]);

        html += `
            <tr>
                <td>${player}</td>
                <td>${data.legsWon.toFixed(2)}</td>
                <td>${data.spares.toFixed(2)}</td>
                <td>${data.topScore.toFixed(2)}</td>
                <td>${data.duckFines.toFixed(2)}</td>
                <td>${data.legFines.toFixed(2)}</td>
                <td>${data.leagueFees.toFixed(2)}</td>
                <td>${data.cupFees.toFixed(2)}</td>
                <td>${data.legFees.toFixed(2)}</td>
                <td><strong>${data.netOwed.toFixed(2)}</strong></td>
            </tr>
        `;

        // Add to totals
        totals.legsWon += data.legsWon;
        totals.spares += data.spares;
        totals.topScore += data.topScore;
        totals.duckFines += data.duckFines;
        totals.legFines += data.legFines;
        totals.leagueFees += data.leagueFees;
        totals.cupFees += data.cupFees;
        totals.legFees += data.legFees;
        totals.netOwed += data.netOwed;
    }

    // Add totals row
    html += `
        <tr class="totals-row">
            <td><strong>Totals</strong></td>
            <td>${totals.legsWon.toFixed(2)}</td>
            <td>${totals.spares.toFixed(2)}</td>
            <td>${totals.topScore.toFixed(2)}</td>
            <td>${totals.duckFines.toFixed(2)}</td>
            <td>${totals.legFines.toFixed(2)}</td>
            <td>${totals.leagueFees.toFixed(2)}</td>
            <td>${totals.cupFees.toFixed(2)}</td>
            <td>${totals.legFees.toFixed(2)}</td>
            <td><strong>${totals.netOwed.toFixed(2)}</strong></td>
        </tr>
    `;

    html += `</tbody></table>`;

    document.getElementById("tableContainer").innerHTML = html;
}
</script>
 
<script>
// =====================================
// MAIN CALCULATION ENGINE
// =====================================
function calculatePlayerTotals(rows) {

    let legsWon = 0;
    let spares = 0;
    let topScore = 0;
    let duckFines = 0;
    let legFines = 0;
    let leagueFees = 0;
    let cupFees = 0;
    let legFees = 0;

    rows.forEach(r => {

        const division = r["Division"];
        const matchType = r["MatchType"]; // "League" or "Cup"
        const legs = parseInt(r["Legs Won"] || 0);
        const spare = parseInt(r["Spares"] || 0);
        const top = parseInt(r["Top Score"] || 0);
        const ducks = parseInt(r["Ducks"] || 0);
        const matchID = r["MatchID"];

        // ============================
        // LEGS WON (EARNINGS)
        // ============================
        legsWon += legs * 2.00;

        // ============================
        // SPARES (EARNINGS)
        // ============================
        spares += spare * 1.80;

        // ============================
        // TOP SCORE (EARNINGS)
        // ============================
        if (top > 0) {
            topScore += 3.00;
        }

        // ============================
        // DUCK FINES (LEAGUE ONLY)
        // ============================
        if (matchType === "League") {
            if (ducks > 0) {
                if (division === "Premier") {
                    duckFines += ducks * 0.50;
                } else {
                    duckFines += ducks * 2.00;
                }
            }
        }

        // ============================
        // LEG FINES (LEAGUE ONLY)
        // ============================
        if (matchType === "League") {
            if (legs > 0) {
                if (division === "Premier" && legs < 5) {
                    legFines += 0.20;
                }
                if (division !== "Premier" && legs < 6) {
                    legFines += 0.20;
                }
            }
        }

        // ============================
        // LEAGUE FEES
        // ============================
        if (matchType === "League") {
            leagueFees += 4.00;
        }

        // ============================
        // CUP FEES
        // ============================
        if (matchType === "Cup") {
            cupFees += getCupFee(matchID);
        }

        // ============================
        // LEG FEES (ALL MATCHES)
        // ============================
        legFees += 1.00;
    });

    // ============================
    // NET OWED (FINES + FEES ONLY)
    // ============================
    const netOwed =
        duckFines +
        legFines +
        leagueFees +
        cupFees +
        legFees +
        spares; // spares are money owed TO team

    return {
        legsWon,
        spares,
        topScore,
        duckFines,
        legFines,
        leagueFees,
        cupFees,
        legFees,
        netOwed
    };
}

// =====================================
// CUP FEE LOOKUP (THIS SEASON)
// =====================================
function getCupFee(matchID) {

    // Add your MatchID → Fee mapping here
    const cupFeeMap = {
        "CUP1": 2.00,
        "CUP2": 2.00,
        "CUP3": 2.00,
        "CUP4": 2.00
        // Add more as needed
    };

    return cupFeeMap[matchID] || 0;
}
</script>
