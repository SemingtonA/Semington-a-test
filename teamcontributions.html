<main class="content">

    <label for="seasonSelect">Season:</label>

        Last updated: —
    </div>

    <table class="contrib-table">
        <thead>
            <tr>
                <th>Player</th>
                <th>Team</th>
                <th>Match Type</th>
                <th>Score</th>

            </tr>
        </thead>

    <!-- YOUR EXISTING TEAM CONTRIBUTIONS SCRIPT GOES HERE -->
<script data-version="6">
document.addEventListener("DOMContentLoaded", function () {

    const matchCSV = "csv_export.csv";
    const feeCSV = "csv_team_fees.csv";

    let matchRows = [];
    let feeTable = {};
    let csvTimestamp = "";

    // Safe CSV parser (handles commas inside quotes)
    function parseCSV(text) {
        return text
            .trim()
            .split(/\r?\n/)
            .map(row => row.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/));
    }

    // Load match data first, then fee table
    fetch(matchCSV)
        .then(r => r.text())
        .then(matchText => {
            const matchData = parseCSV(matchText);
            processMatchCSV(matchData);

            return fetch(feeCSV);
        })
        .then(r => r.text())
        .then(feeText => {
            const feeData = parseCSV(feeText);
            processFeeCSV(feeData);

            populateYearDropdown();
            updateLastUpdated();
        });
    function processMatchCSV(rows) {
        const header = rows[0];

        const idxSeason = header.indexOf("Season");
        const idxPlayer = header.indexOf("Player");
        const idxTeam = header.indexOf("Team");
        const idxMatchType = header.indexOf("MatchType");
        const idxScore = header.indexOf("Score");
        const idxDate = header.indexOf("Date");
        const idxUpdated = header.indexOf("UpdatedAt");

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row[idxPlayer]) continue;

            matchRows.push({
                season: row[idxSeason],
                player: row[idxPlayer],
                team: row[idxTeam],
                matchType: row[idxMatchType],
                score: Number(row[idxScore]),
                date: row[idxDate]
            });

            if (row[idxUpdated]) {
                csvTimestamp = row[idxUpdated];
            }
        }
    }
    function processFeeCSV(rows) {
        const header = rows[0];

        const idxSeason = header.indexOf("Year Dates");
        const idxCupFees = header.indexOf("Cup Fees");
        const idxLeagueFees = header.indexOf("League Fees");
        const idxSpare = header.indexOf("Spare Value");
        const idxDuckPrem = header.indexOf("Duck Value Premier");
        const idxDuckDiv1 = header.indexOf("Duck Value Div 1");
        const idxU5Prem = header.indexOf("Under 5 Premier");
        const idxU6Div1 = header.indexOf("Under 6 Div 1");
        const idxLegs = header.indexOf("Legs won Value");
        const idxTopScore = header.indexOf("Top Score Value");
        const idxSticker = header.indexOf("Sticker Up Fees");

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const season = row[idxSeason];
            if (!season) continue;

            feeTable[season] = {
                cup: Number(row[idxCupFees]),
                league: Number(row[idxLeagueFees]),
                spare: Number(row[idxSpare]),
                duckPrem: Number(row[idxDuckPrem]),
                duckDiv1: Number(row[idxDuckDiv1]),
                u5Prem: Number(row[idxU5Prem]),
                u6Div1: Number(row[idxU6Div1]),
                legs: Number(row[idxLegs]),
                topScore: Number(row[idxTopScore]),
                sticker: Number(row[idxSticker])
            };
        }
    }
    function populateYearDropdown() {
        const select = document.getElementById("seasonSelect");

        const seasons = [...new Set(matchRows.map(r => r.season))].sort();

        select.innerHTML = "";
        seasons.forEach(season => {
            const opt = document.createElement("option");
            opt.value = season;
            opt.textContent = season;
            select.appendChild(opt);
        });

        if (seasons.length > 0) {
            buildTable(seasons[0]);
        }

        select.addEventListener("change", () => {
            buildTable(select.value);
        });
    }

    function buildTable(season) {
        const tbody = document.getElementById("contribBody");
        tbody.innerHTML = "";

        const filtered = matchRows.filter(r => r.season === season);

        filtered.forEach(row => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.player}</td>
                <td>${row.team}</td>
                <td>${row.matchType}</td>
                <td>${row.score}</td>
                <td>${row.date}</td>
            `;

            tbody.appendChild(tr);
        });
    }
    function updateLastUpdated() {
        const el = document.getElementById("lastUpdated");
        if (csvTimestamp) {
            el.textContent = "Last Updated: " + csvTimestamp;
        } else {
            el.textContent = "Last Updated: (no timestamp found)";
        }
    }

});
</script>
