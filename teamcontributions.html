<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contributions - Semington A (Test)</title>

    <!-- FAVICONS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Semington-a-test/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Semington-a-test/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Semington-a-test/favicon-16x16.png">
    <link rel="manifest" href="/Semington-a-test/site.webmanifest">
    <link rel="shortcut icon" href="/Semington-a-test/favicon.ico">

    <style>
        /* PAGE BACKGROUND */
        body {
            margin: 0;
            background-color: #f5f0e6;
            color: black;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER (same structure as Fixtures, different text) */
        .header {
            padding: 20px 20px;
            text-align: center;
            font-size: 100px;
            font-weight: bold;
            color: black;
            position: relative;
        }

        /* LOGO TOP RIGHT (same as Fixtures) */
        .top-right-logo {
            position: absolute;
              top: 10px;
            right: 20px;
            height: 200px;
        }

        /* NAV BAR (from Fixtures) */
        .navbar {
            background-color: #000;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 0;
        }

        .navbar a {
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            font-size: 18px;
            background-color: #222;
            border-radius: 4px;
        }

        .navbar a:hover {
            background-color: #444;
        }

        .navbar .active {
            background-color: #008CBA;
        }

        /* MAIN CONTENT */
        .content {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
            flex: 1; /* push footer down */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* TEAM CONTRIBUTIONS TABLE */
        #contributionsTable {
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        table th, table td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }

        table th {
            background-color: #ddd;
        }

        /* FOOTER (bottom centre, same feel as Fixtures) */
        .footer {
           text-align: center;
            padding: 10px 0;
            color: Black;
        }

        .footer-logo {
            height: 40px;
            margin-top: 10px;
        }

        /* MOBILE FIXES (mirroring Fixtures behaviour) */
        @media (max-width: 768px) {
            .header {
                font-size: 28px;
                padding: 15px 10px;
            }

            .top-right-logo {
                height: 50px;
                top: 8px;
                right: 10px;
            }

            .navbar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px 5px;
            }

            .navbar a {
                font-size: 16px;
                padding: 8px 12px;
            }

            .content {
                padding: 15px;
            }

            #contributionsTable {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER (logo top-right, text = Team Contributions) -->
    <header class="header">
        Team Contributions
        <img src="Semington A Logo 5.jpg" alt="Semington A Skittles Team Logo" class="top-right-logo">
    </header>

    <!-- NAVIGATION BAR (same as Fixtures) -->
    <nav class="navbar">
        <a href="/Semington-a-test/index.html">Home</a>
        <a href="/Semington-a-test/fixtures.html">Fixtures</a>
        <a href="/Semington-a-test/results.html">Results</a>
        <a href="/Semington-a-test/gallery.html">Gallery</a>
        <a href="/Semington-a-test/rules.html">Rules</a>
        <a href="/Semington-a-test/tocatch.html">To Catch</a>
        <a class="active" href="/Semington-a-test/teamcontributions.html">Team Contributions</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="content">
        <h2>Select Season</h2>
        <label for="yearSelect">Season:</label>
        <select id="yearSelect"></select>

        <div id="contributionsTable"></div>
    </main>

    <!-- FOOTER (bottom centre) -->
    <footer class="footer">
        © Semington A Skittles Team
        <br>
        <img src="Semington A Logo 5.jpg" class="footer-logo" alt="Semington A">
    </footer>

    <!-- YOUR EXISTING TEAM CONTRIBUTIONS SCRIPT GOES HERE -->
    <script>
        // paste your JS here (unchanged)
    </script>

</body>
</html>
