<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contributions - Semington A (Test)</title>

    <!-- FAVICONS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Semington-a-test/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Semington-a-test/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Semington-a-test/favicon-16x16.png">
    <link rel="manifest" href="/Semington-a-test/site.webmanifest">
    <link rel="shortcut icon" href="/Semington-a-test/favicon.ico">

    <style>
        body {
            margin: 0;
            background-color: #f5f0e6;
            color: black;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: black;
            position: relative;
        }

        .top-right-logo {
            position: absolute;
            top: 10px;
            right: 20px;
            height: 80px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 0;
            background-color: #222;
        }

        .navbar a {
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            font-size: 18px;
            background-color: #222;
            border-radius: 4px;
        }

        .navbar a:hover {
            background-color: #444;
        }

        .navbar .active {
            background-color: #008CBA;
        }

        .content {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
            flex: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        #divisionDisplay {
            font-weight: bold;
            margin-bottom: 10px;
        }

        #contributionsTable {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        #contributionsTable th,
        #contributionsTable td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }

        #contributionsTable th {
            background-color: #ddd;
        }

        .win {
            background-color: #b6f2ad;
            color: #0a4d00;
            font-weight: 600;
            padding: 4px 6px;
        }

        .paid {
            background-color: #f7c5c5;
            color: #7a0000;
            font-weight: 600;
            padding: 4px 6px;
        }

        .total {
            background-color: #fff4b3;
            font-weight: 700;
            padding: 4px 6px;
        }

        .footer {
            text-align: center;
            padding: 10px 0;
            color: black;
        }

        .footer-logo {
            height: 40px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header {
                font-size: 28px;
                padding: 15px 10px;
            }

            .top-right-logo {
                height: 50px;
                top: 8px;
                right: 10px;
            }

            .navbar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px 5px;
            }

            .navbar a {
                font-size: 16px;
                padding: 8px 12px;
            }

            .content {
                padding: 15px;
            }

            #contributionsTable {
                overflow-x: auto;
                min-width: 600px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        Team Contributions
        <img src="Semington A Logo 5.jpg" alt="Semington A Skittles Team Logo" class="top-right-logo">
    </header>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#" class="active">Contributions</a>
        <a href="#">Fixtures</a>
    </nav>

    <div class="content">
        <h2>Team Contributions</h2>

        <div id="divisionDisplay"></div>

        <table id="contributionsTable"></table>
    </div>

    <footer class="footer">
        Semington A Skittles
    </footer>

 <script>
// Load CSV file
async function loadCSV(file) {
    const response = await fetch(file);
    const text = await response.text();
    return parseCSV(text);
}

// Parse CSV into objects
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    return lines.slice(1).map(line => {
        const values = line.split(",");
        const row = {};
        headers.forEach((h, i) => row[h] = (values[i] || "").trim());
        return row;
    });
}

// Group match rows by player
function groupByPlayer(rows) {
    const players = {};

    rows.forEach(r => {
        const name = r["Semington A Player Name"];
        if (!name) return;

        if (!players[name]) {
            players[name] = {
                Player: name,
                Division: r.Division.toLowerCase(),
                Ducks: 0,
                LegsWon: 0,
                TopScore: 0,
                Spares: 0,
                UnderCount: 0,
                LeagueFees: 0,
                CupFees: 0
            };
        }

        // Ducks
        players[name].Ducks += Number(r.Ducks || 0);

        // Legs Won
        players[name].LegsWon += Number(r["Legs Won "] || 0);

        // Top Score
        players[name].TopScore += Number(r["Top Score"] || 0);

        // Spares
        players[name].Spares += Number(r.Spares || 0);

        // Under-5 or Under-6
        const legs = [
            Number(r["Leg 1:"] || 0),
            Number(r["Leg 2: "] || 0),
            Number(r["Leg 3: "] || 0),
            Number(r["Leg 4: "] || 0),
            Number(r["Leg 5: "] || 0),
            Number(r["Leg 6:"] || 0)
        ];

        const threshold = r.Division.toLowerCase() === "premier" ? 5 : 6;
        players[name].UnderCount += legs.filter(l => l < threshold).length;
    });

    return Object.values(players);
}

// Extract fee rules for the season
function getFeeRules(feesCSV, season) {
    return feesCSV.find(r => r["Year Dates"] === season);
}

// Build final table rows
function calculateRow(player, fees) {
    const isPremier = player.Division === "premier";

    const duckValue = isPremier ? Number(fees["Duck Value Premier"]) : Number(fees["Duck Value Div 1"]);
    const underValue = isPremier ? Number(fees["Under 5 Premier"]) : Number(fees["Under 6 Div 1"]);

    const legsWonValue = Number(fees["Legs won Value"]);
    const topScoreValue = Number(fees["Top Score Value"]);

    const leagueFees = Number(fees["League Fees"] || 0);
    const cupFees = Number(fees["Cup Fees"] || 0);

    const duckFine = player.Ducks * duckValue;
    const underFine = player.UnderCount * underValue;

    const winMoney = (player.LegsWon * legsWonValue) +
                     (player.TopScore * topScoreValue) +
                     (player.Spares * Number(fees["Spare Value"] || 0));

    const totalPaid = duckFine + underFine + leagueFees + cupFees;
    const net = winMoney - totalPaid;

    return {
        Player: player.Player,
        LegsWon: winMoney.toFixed(2),
        Ducks: duckFine.toFixed(2),
        Under: underFine.toFixed(2),
        LeagueFees: leagueFees.toFixed(2),
        CupFees: cupFees.toFixed(2),
        TotalWin: winMoney.toFixed(2),
        Net: net.toFixed(2)
    };
}

// Render table
function renderTable(rows) {
    const table = document.getElementById("contributionsTable");
    table.innerHTML = "";

    const headers = [
        "Player",
        "Legs Won (£)",
        "Ducks (£)",
        "Under (£)",
        "League Fees (£)",
        "Cup Fees (£)",
        "Total Win (£)",
        "Net (£)"
    ];

    let headerRow = "<tr>";
    headers.forEach(h => headerRow += `<th>${h}</th>`);
    headerRow += "</tr>";
    table.innerHTML += headerRow;

    rows.forEach(r => {
        table.innerHTML += `
            <tr>
                <td>${r.Player}</td>
                <td class="win">£${r.LegsWon}</td>
                <td class="paid">£${r.Ducks}</td>
                <td class="paid">£${r.Under}</td>
                <td class="paid">£${r.LeagueFees}</td>
                <td class="paid">£${r.CupFees}</td>
                <td class="total">£${r.TotalWin}</td>
                <td class="total">£${r.Net}</td>
            </tr>
        `;
    });
}

// Init
async function init() {
    const matches = await loadCSV("csv_export.csv");
    const feesCSV = await loadCSV("csv_team_fees.csv");

    const season = matches[0]["Year Dates"];
    const feeRules = getFeeRules(feesCSV, season);

    const players = groupByPlayer(matches);
    const finalRows = players.map(p => calculateRow(p, feeRules));

    document.getElementById("divisionDisplay").textContent =
        "Division: " + players[0].Division;

    renderTable(finalRows);
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
