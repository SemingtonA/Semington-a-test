    <style>

        body {
            margin: 0;

            padding: 20px 20px;

            font-weight: bold;

        /* NAV BAR (from Fixtures) */

            justify-content: center;
            gap: 10px;

            color: white;
            padding: 10px 16px;

        /* FOOTER (bottom centre, same feel as Fixtures) */

           text-align: center;
            padding: 10px 0;
            color: Black;
        }

        .footer-logo {
            height: 40px;
            margin-top: 10px;
        }

        /* MOBILE FIXES (mirroring Fixtures behaviour) */
        @media (max-width: 768px) {
            .header {
                font-size: 28px;
                padding: 15px 10px;
            }

<body>

    <!-- HEADER (logo top-right, text = Team Contributions) -->
        <header class="header">
        Team Contributions

    <!-- MAIN CONTENT -->
    <main class="content">
        <h2>Select Season</h2>
        <label for="yearSelect">Season:</label>
        <select id="yearSelect"></select>

        <div id="contributionsTable"></div>
    </main>

        <br>
        <img src="Semington A Logo 5.jpg" class="footer-logo" alt="Semington A">

    <!-- YOUR EXISTING TEAM CONTRIBUTIONS SCRIPT GOES HERE -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const csvPath = "csv_export.csv";

    let feeTable = {};
    let cupFees = {};
    let matchRows = [];

    fetch(csvPath)
        .then(response => response.text())
        .then(data => {
            const rows = data.split("\n").map(r => r.split(","));
            processCSV(rows);
            populateYearDropdown();
        });

    function processCSV(rows) {

        rows.forEach(row => {

            // -----------------------------
            // MATCH DATA (Columns A → U)
            // -----------------------------
            const matchType = row[3];   // Match Details
            const homeAway = row[4];
            const division = row[5];
            const player = row[6];

            if (matchType === "League" || matchType === "Cup") {
                matchRows.push(row);
            }

            // -----------------------------
            // FEE TABLE (Columns AA → AL)
            // -----------------------------
            const year = row[26]?.replace(/\s+/g, " ").trim();      // AA
            const cupID = row[27];
            const cupFee = row[28];
            const leagueFee = row[29];

            // Fee rows (League Fee NOT empty)
            if (year && leagueFee && leagueFee.trim() !== "") {

                feeTable[year] = {
                    leagueFee: parseFloat(row[29]) || 0,
                    spareValue: parseFloat(row[30]) || 0,
                    duckPrem: parseFloat(row[31]) || 0,
                    duckDiv1: parseFloat(row[32]) || 0,
                    under5Prem: parseFloat(row[33]) || 0,
                    under6Div1: parseFloat(row[34]) || 0,
                    legsWonValue: parseFloat(row[35]) || 0,
                    topScoreValue: parseFloat(row[36]) || 0,
                    stickerUp: parseFloat(row[37]) || 0
                };

                cupFees[year] = {};
            }

            // Cup fee rows (League Fee empty)
            if (year && cupID && cupFee && (!leagueFee || leagueFee.trim() === "")) {
                if (!cupFees[year]) cupFees[year] = {};
                cupFees[year][cupID.trim()] = parseFloat(cupFee);
            }
        });
    }

    function populateYearDropdown() {
        const select = document.getElementById("yearSelect");
        select.innerHTML = "";

        Object.keys(feeTable).forEach(year => {
            const opt = document.createElement("option");
            opt.value = year;
            opt.textContent = year;
            select.appendChild(opt);
        });

        select.addEventListener("change", () => buildTable(select.value));

        if (select.value) buildTable(select.value);
    }

    function buildTable(year) {

        const fees = feeTable[year];
        const cupFeeLookup = cupFees[year];

        let playerTotals = {};

        matchRows.forEach(row => {

            // NORMALISE SEASON STRING HERE
            const matchYear = row[1]?.replace(/\s+/g, " ").trim();

            if (matchYear !== year) return;

            const matchType = row[3];
            const homeAway = row[4];
            const division = row[5];
            const player = row[6];

            const legs = parseInt(row[16]) || 0;
            const ducks = parseInt(row[14]) || 0;
            const spares = parseInt(row[17]) || 0;
            const topScore = parseInt(row[15]) || 0;

            let cupID = "";
            if (matchType === "Cup") {
                const matchName = row[3];
                if (matchName.includes("10")) cupID = "10 " + homeAway;
                if (matchName.includes("8")) cupID = "8 " + homeAway;
            }

            let total = 0;

            total += legs * fees.legsWonValue;

            if (division === "premier") total += ducks * fees.duckPrem;
            else total += ducks * fees.duckDiv1;

            total += spares * fees.spareValue;

            total += topScore * fees.topScoreValue;

            total += fees.stickerUp;

            if (matchType === "League") total += fees.leagueFee;

            if (matchType === "Cup" && cupFeeLookup[cupID]) {
                total += cupFeeLookup[cupID];
            }

            if (!playerTotals[player]) playerTotals[player] = 0;
            playerTotals[player] += total;
        });

        renderTable(playerTotals);
    }

    function renderTable(playerTotals) {

        let html = `
            <table>
                <tr>
                    <th>Player</th>
                    <th>Total Contribution (£)</th>
                </tr>
        `;

        Object.keys(playerTotals).forEach(player => {
            html += `
                <tr>
                    <td>${player}</td>
                    <td>£${playerTotals[player].toFixed(2)}</td>
                </tr>
            `;
        });

        html += `</table>`;

        document.getElementById("contributionsTable").innerHTML = html;
    }

});
</script>

        </html>
