<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Contributions</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    /* NAV BUTTONS */
    .nav-buttons ul {
        list-style: none;
        padding: 0;
        margin: 0 0 15px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .nav-buttons li {
        margin: 0;
    }

    .nav-buttons a {
        display: inline-block;
        padding: 8px 14px;
        background: black;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 15px;
    }

    .nav-buttons a.active {
        background: #444;
    }

    .season-bar {
        margin-bottom: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .season-dropdown {
        font-size: 16px;
        padding: 4px 8px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 6px 8px;
        text-align: center;
    }

    th {
        background: #f0f0f0;
    }

    .totals-row {
        background: #e8f4ff;
        font-weight: bold;
    }

    #lastUpdated {
        margin-top: 10px;
        font-style: italic;
    }
</style>
</head>

<body>

<h2>Team Contributions</h2>
<div id="lastUpdated"></div>

<!-- ===== NAVIGATION BUTTONS ===== -->
<nav class="nav-buttons">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="results.html">Results</a></li>
        <li><a href="tocatch.html">To Catch Each Player</a></li>
        <li><a href="rules.html">Rules</a></li>
        <li><a href="tocatch.html">To Catch</a></li>
        <li><a href="teamcontributions.html" class="active">Team Contributions</a></li>
    </ul>
</nav>

<!-- ===== SEASON DROPDOWN BAR ===== -->
<div class="season-bar">
    Season:
    <select id="seasonSelect" class="season-dropdown"></select>
</div>

<!-- ===== TABLE CONTAINER ===== -->
<div id="tableContainer"></div>

<script>

let csvData = [];
let seasons = [];

/* ===============================
   LOAD CSV
================================ */
fetch("csv_export.csv")
    .then(r => r.text())
    .then(text => {
        csvData = parseCSV(text);
        extractSeasons();
        populateSeasonDropdown();
        applySeasonFilter();
    });

/* ===============================
   PARSE CSV (SAFE)
================================ */
function parseCSV(text) {

    // Split into lines
    const lines = text.trim().split(/\r?\n/);

    // Extract header row
    const headers = lines[0].split(",");

    // Convert each row into an object
    const rows = lines.slice(1).map(line => {
        const cols = line.split(",");
        const obj = {};
        headers.forEach((h, i) => {
            obj[h.trim()] = (cols[i] || "").trim();
        });
        return obj;
    });

    return rows;
}


/* ===============================
   NORMALISE ROW
================================ */
function normaliseRow(r) {

    const matchDetails = (r["Match Details"] || "").toLowerCase();
    const division = (r["Division"] || "").toLowerCase();

    return {
        player: r["Semington A Player Name"] || "",
        season: r["Season"] || "",
        matchType: matchDetails.includes("cup") ? "cup" : "league",
        division: division.includes("prem") ? "premier" : "div1",
        legsWon: parseInt(r["Legs Won"] || 0),
        spares: parseInt(r["Spares"] || 0),
        topScore: parseInt(r["Top Score"] || 0),
        ducks: parseInt(r["Ducks"] || 0),
        matchID: r["Match ID"] || "",
        updated: r["UpdatedAt"] || "",
        oppositionPlayer: r["Opposition Player Name"] || ""
    };
}

/* ===============================
   SEASON HANDLING
================================ */
function extractSeasons() {
    const set = new Set();
    csvData.forEach(r => {
        if (r["Season"]) set.add(r["Season"]);
    });
    seasons = Array.from(set).sort((a, b) => {
        return parseInt(b.split("-")[0]) - parseInt(a.split("-")[0]);
    });
}

function populateSeasonDropdown() {
    const dd = document.getElementById("seasonSelect");
    dd.innerHTML = "";
    seasons.forEach(season => {
        const opt = document.createElement("option");
        opt.value = season;
        opt.textContent = season;
        dd.appendChild(opt);
    });
    if (seasons.length > 0) dd.value = seasons[0];
    dd.addEventListener("change", applySeasonFilter);
}

/* ===============================
   LAST UPDATED
================================ */
function ordinal(n) {
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function updateLastUpdated(rows) {
    const el = document.getElementById("lastUpdated");

    const timestamps = rows
        .map(r => r.updated)
        .filter(t => t && t !== "")
        .map(t => new Date(t));

    if (!timestamps.length) {
        el.textContent = "Last updated: No timestamp";
        return;
    }

    const latest = new Date(Math.max(...timestamps));

    el.textContent =
        "Last updated: " +
        latest.toLocaleDateString("en-GB", { weekday: "short" }) + " " +
        ordinal(latest.getDate()) + " " +
        latest.toLocaleDateString("en-GB", { month: "long", year: "numeric" }) +
        " " +
        latest.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

/* ===============================
   APPLY SEASON FILTER
================================ */
function applySeasonFilter() {
    const season = document.getElementById("seasonSelect").value;

    const filtered = csvData
        .map(normaliseRow)
        .filter(r => r.season === season);

    updateLastUpdated(filtered);
    buildContributionsTable(filtered);
}

/* ===============================
   CALCULATIONS
================================ */
function calculatePlayerTotals(rows) {

    let legsWon = 0, spares = 0, topScore = 0;
    let duckFines = 0, legFines = 0;
    let leagueFees = 0, cupFees = 0, legFees = 0;

    rows.forEach(r => {

        legsWon += r.legsWon * 2.00;
        spares += r.spares * 1.80;
        if (r.topScore > 0) topScore += 3.00;

        if (r.matchType === "league") {

            if (r.ducks > 0) {
                duckFines += (r.division === "premier") ? r.ducks * 0.50 : r.ducks * 2.00;
            }

            if (r.legsWon > 0) {
                if (r.division === "premier" && r.legsWon < 5) legFines += 0.20;
                if (r.division !== "premier" && r.legsWon < 6) legFines += 0.20;
            }

            leagueFees += 4.00;
        }

        if (r.matchType === "cup") {
            cupFees += 2.00;
        }

        legFees += 1.00;
    });

    const netOwed =
        duckFines + legFines + leagueFees + cupFees + legFees + spares;

    return {
        legsWon, spares, topScore,
        duckFines, legFines,
        leagueFees, cupFees, legFees,
        netOwed
    };
}
    
    function showValue(v) {
    return (v === 0 || v === "0" || v === 0.00) ? "" : v;
}

/* ===============================
   BUILD TABLE
================================ */
function buildContributionsTable(rows) {
    
const players = {};

rows.forEach(r => {
    const name = r.player?.trim();

    // Skip empty names
    if (!name) return;

    // Skip placeholder players
    if (name === "A N Other") return;
    if (name === "AN Other") return;
    if (name === "Anon") return;

    // Skip opposition rows
    if (r.oppositionPlayer && r.oppositionPlayer.length > 0) return;

    // KEEP players even if their stats are 0
    if (!players[name]) players[name] = [];
    players[name].push(r);
});

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Legs Won (£)</th>
                    <th>Spares (£)</th>
                    <th>Top Score (£)</th>
                    <th>Duck Fines (£)</th>
                    <th>Leg Fines (£)</th>
                    <th>League Fees (£)</th>
                    <th>Cup Fees (£)</th>
                    <th>Leg Fees (£)</th>
                    <th>Net Owed (£)</th>
                </tr>
            </thead>
            <tbody>
    `;

    let totals = {
        legsWon: 0, spares: 0, topScore: 0,
        duckFines: 0, legFines: 0,
        leagueFees: 0, cupFees: 0, legFees: 0,
        netOwed: 0
    };

    for (const player in players) {
        const data = calculatePlayerTotals(players[player]);

        html += `
            <tr>
                <td>${player}</td>
                <td>${data.legsWon.toFixed(2)}</td>
                <td>${data.spares.toFixed(2)}</td>
                <td>${data.topScore.toFixed(2)}</td>
                <td>${data.duckFines.toFixed(2)}</td>
                <td>${data.legFines.toFixed(2)}</td>
                <td>${data.leagueFees.toFixed(2)}</td>
                <td>${data.cupFees.toFixed(2)}</td>
                <td>${data.legFees.toFixed(2)}</td>
                <td><strong>${data.netOwed.toFixed(2)}</strong></td>
            </tr>
        `;

        Object.keys(totals).forEach(k => totals[k] += data[k]);
    }
html += `
    <tr class="totals-row">
        <td><strong>Totals</strong></td>
        <td>${showValue(totals.legsWon.toFixed(2))}</td>
        <td>${showValue(totals.spares.toFixed(2))}</td>
        <td>${showValue(totals.topScore.toFixed(2))}</td>
        <td>${showValue(totals.duckFines.toFixed(2))}</td>
        <td>${showValue(totals.legFines.toFixed(2))}</td>
        <td>${showValue(totals.leagueFees.toFixed(2))}</td>
        <td>${showValue(totals.cupFees.toFixed(2))}</td>
        <td>${showValue(totals.legFees.toFixed(2))}</td>
        <td><strong>${showValue(totals.netOwed.toFixed(2))}</strong></td>
    </tr>
`;

   

    html += `</tbody></table>`;
    document.getElementById("tableContainer").innerHTML = html;
}

</script>

</body>
</html>
