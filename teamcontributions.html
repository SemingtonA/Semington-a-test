<main>

  

<body>

<div class="content-box">
  <div class="header-row">
    <h2>Team Contributions</h2>
    <div id="lastUpdated">Last updated: —</div>
  </div>

  <table>
    <colgroup>
      <col>
      <col style="width:80px">
      <col style="width:80px">
      <col style="width:80px">
      <col style="width:80px">
      <col style="width:80px">
      <col style="width:80px">
      <col style="width:80px">
    </colgroup>

    <thead>
      <tr>
        <th>Team Player</th>
        <th class="center">League Games</th>
        <th class="center">Cup Games</th>
        <th>League Fees</th>
        <th>Duck Fines</th>
        <th>Low Score Fines</th>
        <th>Total Fines</th>
        <th>Net Owed</th>
      </tr>
    </thead>

    <tbody id="accountsBody"></tbody>
  </table>
</div>

<script>
fetch("csv_export.csv?v=" + Date.now(), { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("csv_export.csv not found");
    return r.text();
  })
  .then(text => {

    // BULLETPROOF CSV PARSER
    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const c = line[i];

        if (c === '"') {
          insideQuotes = !insideQuotes;
        } else if (c === ',' && !insideQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += c;
        }
      }

      result.push(current.trim());
      return result;
    }

    const rows = text.trim().split(/\r?\n/).map(parseCSVLine);

    const header = rows.shift();
    const idx = n => header.indexOf(n);

    // COLUMN INDEXES
    const iPlayer   = idx("Semington A Player Name");
    const iDucks    = idx("Ducks");
    const iDetails  = idx("Match Details");
    const iMatchId  = idx("Match ID");
    const iUpdated  = idx("UpdatedAt");

    const iLeg1 = idx("Leg 1:");
    const iLeg2 = idx("Leg 2:");
    const iLeg3 = idx("Leg 3:");
    const iLeg4 = idx("Leg 4:");
    const iLeg5 = idx("Leg 5:");
    const iLeg6 = idx("Leg 6:");
    const iTotal = idx("Total Score"); // used for lowest player in match

    console.log("HEADER CHECK:", {
      iPlayer,
      iDucks,
      iDetails,
      iMatchId,
      iUpdated,
      iLeg1,
      iLeg2,
      iLeg3,
      iLeg4,
      iLeg5,
      iLeg6,
      iTotal
    });

    const players = {};
    const invalidPlayers = new Set([
      "O",
      "0",
      "A N Other",
      "A  N Other",
      "A N Others 4 and Under"
    ]);

    let totalLeagueFees = 0;
    let totalDuckFines  = 0;
    let totalLowFines   = 0;
    let totalOwed       = 0;
    let latest          = "";

    const LOW_SCORE_LIMIT = 5;

    // GROUP ROWS BY MATCH
    const matches = {};

    rows.forEach(r => {
      const matchId = r[iMatchId];
      if (!matchId) return;

      if (!matches[matchId]) matches[matchId] = [];
      matches[matchId].push(r);
    });

    // PROCESS EACH MATCH
    Object.values(matches).forEach(matchRows => {

      // real players in this match
      const realPlayers = matchRows.filter(r => !invalidPlayers.has(r[iPlayer]));

      // lowest scoring real player (by Total Score)
      let lowestPlayerRow = null;
      let lowestScore = Infinity;

      realPlayers.forEach(r => {
        const total = Number(r[iTotal] || 0);
        if (total < lowestScore) {
          lowestScore = total;
          lowestPlayerRow = r;
        }
      });

      // process each row in this match
      matchRows.forEach(r => {

        const originalPlayer = r[iPlayer];
        let player = originalPlayer;

        // reassign ghost players to lowest real player
        if (invalidPlayers.has(originalPlayer)) {
          if (lowestPlayerRow) {
            player = lowestPlayerRow[iPlayer];
          } else {
            return; // no valid players in this match
          }
        }

        if (!player) return;

        if (!players[player]) {
          players[player] = {
            leagueGames: 0,
            cupGames: 0,
            leagueFees: 0,
            duckFines: 0,
            lowScoreFines: 0,
            totalFines: 0,
            netOwed: 0
          };
        }

        const p = players[player];
        const details = r[iDetails] || "";

        // ONLY REAL PLAYERS EARN LEAGUE/CUP GAMES
        if (!invalidPlayers.has(originalPlayer)) {
          if (details.includes("League")) p.leagueGames++;
          if (details.includes("Cup"))    p.cupGames++;
        }

        // league fees
        p.leagueFees = p.leagueGames * 1;

        // duck fines (ghost rows still count against reassigned player)
        const ducks = Number(r[iDucks] || 0);
        p.duckFines += ducks;

        // low score fines
        const legs = [
          Number(r[iLeg1] || 0),
          Number(r[iLeg2] || 0),
          Number(r[iLeg3] || 0),
          Number(r[iLeg4] || 0),
          Number(r[iLeg5] || 0),
          Number(r[iLeg6] || 0)
        ];

        legs.forEach(l => {
          if (l > 0 && l < LOW_SCORE_LIMIT) {
            p.lowScoreFines++;
          }
        });

        p.totalFines = p.duckFines + p.lowScoreFines;
        p.netOwed = p.leagueFees + p.totalFines;

        totalLeagueFees += p.leagueFees;
        totalDuckFines  += p.duckFines;
        totalLowFines   += p.lowScoreFines;
        totalOwed       += p.netOwed;

        const updated = r[iUpdated];
        if (updated && updated > latest) latest = updated;
      });
    });

    // RENDERING
    const body = document.getElementById("accountsBody");
    body.innerHTML = "";

    Object.keys(players).sort().forEach(name => {
      const p = players[name];

      body.innerHTML += `
        <tr>
          <td>${name}</td>
          <td class="center">${p.leagueGames}</td>
          <td class="center">${p.cupGames}</td>
          <td>£${p.leagueFees}</td>
          <td>£${p.duckFines}</td>
          <td>£${p.lowScoreFines}</td>
          <td>£${p.totalFines}</td>
          <td>£${p.netOwed}</td>
        </tr>
      `;
    });

  });
</script>





</body>
