    <select id="seasonSelect" class="season-dropdown"></select>

<!-- ===== TABLE CONTAINER ===== -->
<div id="tableContainer"></div>

<script>

let csvData = [];
let seasons = [];
// =========================
// 1. CSV LOADING + PARSING
// =========================

async function loadCSV(url) {
    const res = await fetch(url);
    const text = await res.text();
    return parseCSV(text);
}

// Parse CSV into array of objects using first row as headers
function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];

    const headers = lines[0].split(",").map(h => h.trim());

    const rows = lines.slice(1).map(line => {
        const cols = line.split(",").map(c => c.trim());
        const obj = {};
        headers.forEach((h, i) => {
            obj[h] = cols[i] || "";
        });
        return obj;
    });

    return rows;
}

// =========================
// 2. NORMALISE ROWS
// =========================

function normaliseRow(r) {
    const matchDetails = (r["Match Details"] || "").toLowerCase();
    const division = (r["Division"] || "").toLowerCase();

    // Safe numeric conversion
    const n = v => {
        const x = Number(v);
        return Number.isFinite(x) ? x : 0;
    };

    return {
        player: r["Semington A Player Name"] || "",
        season: r["Season"] || "",
        matchType: matchDetails.includes("cup") ? "cup" : "league",
        division: division.includes("prem") ? "premier" : "div1",
        legsWon: n(r["Legs Won"]),
        spares: n(r["Spares"]),
        topScore: n(r["Top Score"]),
        ducks: n(r["Ducks"]),
        matchID: r["Match ID"] || "",
        updated: r["UpdatedAt"] || "",
        oppositionPlayer: r["Opposition Player Name"] || ""
    };
}

// =========================
// 3. VALUE DISPLAY HELPERS
// =========================

// Blank out zero values in cells
function showValue(v) {
    const num = Number(v);
    if (!Number.isFinite(num)) return ""; // safety
    return num === 0 ? "" : num.toFixed(2);
}

// For integer stats (legs, spares, etc.)
function showInt(v) {
    const num = Number(v);
    if (!Number.isFinite(num)) return "";
    return num === 0 ? "" : num.toString();
}

// =========================
// 4. BUILD CONTRIBUTIONS TABLE
// =========================

function buildContributionsTable(rows) {

    // 4.1 Group rows by player (Semington A only)
    const players = {};

    rows.forEach(r => {
        const name = (r.player || "").trim();

        // Skip empty names
        if (!name) return;

        // Skip placeholder players
        if (name === "A N Other" || name === "AN Other" || name === "Anon") return;

        // Skip opposition rows
        if (r.oppositionPlayer && r.oppositionPlayer.trim().length > 0) return;

        if (!players[name]) players[name] = [];
        players[name].push(r);
    });

    // 4.2 Compute stats per player
    const playerStats = [];

    Object.keys(players).forEach(name => {
        const rowsForPlayer = players[name];

        let legsWon = 0;
        let spares = 0;
        let topScore = 0;
        let ducks = 0;
        let leagueFees = 0;
        let cupFees = 0;
        let legFees = 0;
        let duckFines = 0;
        let legFines = 0;

        rowsForPlayer.forEach(r => {
            legsWon += r.legsWon;
            spares += r.spares;
            topScore = Math.max(topScore, r.topScore);
            ducks += r.ducks;

            // Example fee logic (adjust if you have different rules)
            // Here I’m assuming:
            // - leagueFees / cupFees / legFees are per match or per leg
            // Replace with your real logic if needed.
            if (r.matchType === "league") {
                leagueFees += 4; // example
            } else if (r.matchType === "cup") {
                cupFees += 4; // example
            }

            legFees += r.legsWon * 1; // example: £1 per leg won
            duckFines += r.ducks * 1;  // example: £1 per duck
        });

        const netOwed =
            leagueFees +
            cupFees +
            legFees +
            duckFines +
            legFines; // legFines currently 0 unless you add logic

        playerStats.push({
            name,
            legsWon,
            spares,
            topScore,
            ducks,
            duckFines,
            legFines,
            leagueFees,
            cupFees,
            legFees,
            netOwed
        });
    });

    // 4.3 Build HTML table

    let html = "";

    html += `
        <table class="contributions-table">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Legs Won (£)</th>
                    <th>Spares (£)</th>
                    <th>Top Score (£)</th>
                    <th>Duck Fines (£)</th>
                    <th>Leg Fines (£)</th>
                    <th>League Fees (£)</th>
                    <th>Cup Fees (£)</th>
                    <th>Leg Fees (£)</th>
                    <th>Net Owed (£)</th>
                </tr>
            </thead>
            <tbody>
    `;

    const totals = {
        legsWon: 0,
        spares: 0,
        topScore: 0,
        duckFines: 0,
        legFines: 0,
        leagueFees: 0,
        cupFees: 0,
        legFees: 0,
        netOwed: 0
    };

    playerStats.forEach(p => {
        totals.legsWon += p.legsWon;
        totals.spares += p.spares;
        totals.topScore = Math.max(totals.topScore, p.topScore);
        totals.duckFines += p.duckFines;
        totals.legFines += p.legFines;
        totals.leagueFees += p.leagueFees;
        totals.cupFees += p.cupFees;
        totals.legFees += p.legFees;
        totals.netOwed += p.netOwed;

        html += `
            <tr>
                <td>${p.name}</td>
                <td>${showInt(p.legsWon)}</td>
                <td>${showInt(p.spares)}</td>
                <td>${showInt(p.topScore)}</td>
                <td>${showValue(p.duckFines)}</td>
                <td>${showValue(p.legFines)}</td>
                <td>${showValue(p.leagueFees)}</td>
                <td>${showValue(p.cupFees)}</td>
                <td>${showValue(p.legFees)}</td>
                <td><strong>${showValue(p.netOwed)}</strong></td>
            </tr>
        `;
    });

    // Totals row (blank zeros)
    html += `
        <tr class="totals-row">
            <td><strong>Totals</strong></td>
            <td>${showInt(totals.legsWon)}</td>
            <td>${showInt(totals.spares)}</td>
            <td>${showInt(totals.topScore)}</td>
            <td>${showValue(totals.duckFines)}</td>
            <td>${showValue(totals.legFines)}</td>
            <td>${showValue(totals.leagueFees)}</td>
            <td>${showValue(totals.cupFees)}</td>
            <td>${showValue(totals.legFees)}</td>
            <td><strong>${showValue(totals.netOwed)}</strong></td>
        </tr>
    `;

    html += `
            </tbody>
        </table>
    `;

    return html;
}

// =========================
// 5. MAIN ENTRY
// =========================

async function initTeamContributions() {
    // Adjust this path if your CSV is elsewhere
    const csvUrl = "data/teamcontributions.csv";

    const rawRows = await loadCSV(csvUrl);
    const rows = rawRows.map(normaliseRow);

    const tableHtml = buildContributionsTable(rows);

    const container = document.getElementById("team-contributions-container");
    if (container) {
        container.innerHTML = tableHtml;
    }
}

// Run on load
document.addEventListener("DOMContentLoaded", initTeamContributions);


</script>
