<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contributions</title>

  <style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background-color: #f5f0e6;
  }

  /* ===== HEADER ===== */
  header {
    padding: 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    margin: 0;
    font-size: 72px;
    text-align: center;
    flex: 1;
  }

  .logo img {
    width: 300px;
    height: auto;
  }

  .nav-buttons {
    margin-top: 15px;
    text-align: center;
  }

  .nav-buttons a {
    display: inline-block;
    margin: 6px;
    padding: 10px 18px;
    background: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
  }

  .nav-buttons a:hover {
    background: #163aa3;
  }

  /* Highlight active page */
  .nav-buttons a.active {
    background: #163aa3;
  }

  /* ===== MAIN ===== */
  main {
    flex: 1;
    padding: 20px;
  }

  #divisionDisplay {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 15px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffffcc;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #555;
    padding: 10px;
    text-align: center;
  }

  th {
    background: #ddd;
  }

  .win {
    background: #b6f2ad;
    font-weight: bold;
  }

  .paid {
    background: #f7c5c5;
    font-weight: bold;
  }

  .total {
    background: #fff4b3;
    font-weight: bold;
  }

  /* ===== FOOTER ===== */
  footer {
    margin-top: auto;
    text-align: center;
    padding: 16px 20px 22px;
    font-size: 12px;
    color: #555;
  }

  .footer-logo img {
    width: 60px;
    opacity: 0.9;
  }

  /* ===== MOBILE ===== */
  @media (max-width: 900px) {

    .header-top {
      flex-direction: column;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-top: 10px;
    }

    .logo img {
      width: 150px;
      margin-bottom: 10px;
    }

    table {
      font-size: 12px;
    }

    .footer-logo img {
      width: 48px;
    }
  }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Team Contributions</h1>

    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>

  <div class="nav-buttons">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures &amp; Results</a>
    <a href="match-results-v2.html">Match Results</a>
    <a href="tocatch.html">To Catch</a>
    <a href="gallery.html">Gallery</a>
    <a href="rules.html">Rules</a>
    <a href="teamcontributions.html" class="active">Team Contributions</a>
  </div>
</header>

<main>

  <div id="divisionDisplay"></div>

  <table id="contributionsTable"></table>

</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>

<script>
// Load CSV file
async function loadCSV(file) {
    const response = await fetch(file);
    const text = await response.text();
    return parseCSV(text);
}

// Parse CSV into objects
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    return lines.slice(1).map(line => {
        const values = line.split(",");
        const row = {};
        headers.forEach((h, i) => row[h] = (values[i] || "").trim());
        return row;
    });
}

// Group match rows by player
function groupByPlayer(rows) {
    const players = {};

    rows.forEach(r => {
        const name = r["Semington A Player Name"];
        if (!name) return;

        if (!players[name]) {
            players[name] = {
                Player: name,
                Division: r.Division.toLowerCase(),
                Ducks: 0,
                LegsWon: 0,
                TopScore: 0,
                Spares: 0,
                UnderCount: 0
            };
        }

        players[name].Ducks += Number(r.Ducks || 0);
        players[name].LegsWon += Number(r["Legs Won "] || 0);
        players[name].TopScore += Number(r["Top Score"] || 0);
        players[name].Spares += Number(r.Spares || 0);

        const legs = [
            Number(r["Leg 1:"] || 0),
            Number(r["Leg 2: "] || 0),
            Number(r["Leg 3: "] || 0),
            Number(r["Leg 4: "] || 0),
            Number(r["Leg 5: "] || 0),
            Number(r["Leg 6:"] || 0)
        ];

        const threshold = r.Division.toLowerCase() === "premier" ? 5 : 6;
        players[name].UnderCount += legs.filter(l => l < threshold).length;
    });

    return Object.values(players);
}

// Extract fee rules for the season
function getFeeRules(feesCSV, season) {
    return feesCSV.find(r => r["Year Dates"] === season);
}

// Build final table rows
function calculateRow(player, fees) {
    const isPremier = player.Division === "premier";

    const duckValue = isPremier ? Number(fees["Duck Value Premier"]) : Number(fees["Duck Value Div 1"]);
    const underValue = isPremier ? Number(fees["Under 5 Premier"]) : Number(fees["Under 6 Div 1"]);

    const legsWonValue = Number(fees["Legs won Value"]);
    const topScoreValue = Number(fees["Top Score Value"]);
    const spareValue = Number(fees["Spare Value"] || 0);

    const leagueFees = Number(fees["League Fees"] || 0);
    const cupFees = Number(fees["Cup Fees"] || 0);

    const duckFine = player.Ducks * duckValue;
    const underFine = player.UnderCount * underValue;

    const winMoney =
        (player.LegsWon * legsWonValue) +
        (player.TopScore * topScoreValue) +
        (player.Spares * spareValue);

    const totalPaid = duckFine + underFine + leagueFees + cupFees;
    const net = winMoney - totalPaid;

    return {
        Player: player.Player,
        LegsWon: winMoney.toFixed(2),
        Ducks: duckFine.toFixed(2),
        Under: underFine.toFixed(2),
        LeagueFees: leagueFees.toFixed(2),
        CupFees: cupFees.toFixed(2),
        TotalWin: winMoney.toFixed(2),
        Net: net.toFixed(2)
    };
}

// Render table
function renderTable(rows) {
    const table = document.getElementById("contributionsTable");
    table.innerHTML = "";

    const headers = [
        "Player",
        "Legs Won (£)",
        "Ducks (£)",
        "Under (£)",
        "League Fees (£)",
        "Cup Fees (£)",
        "Total Win (£)",
        "Net (£)"
    ];

    let headerRow = "<tr>";
    headers.forEach(h => headerRow += `<th>${h}</th>`);
    headerRow += "</tr>";
    table.innerHTML += headerRow;

    rows.forEach(r => {
        table.innerHTML += `
            <tr>
                <td>${r.Player}</td>
                <td class="win">£${r.LegsWon}</td>
                <td class="paid">£${r.Ducks}</td>
                <td class="paid">£${r.Under}</td>
                <td class="paid">£${r.LeagueFees}</td>
                <td class="paid">£${r.CupFees}</td>
                <td class="total">£${r.TotalWin}</td>
                <td class="total">£${r.Net}</td>
            </tr>
        `;
    });
}

// Init
async function init() {
    const matches = await loadCSV("csv_export.csv");
    const feesCSV = await loadCSV("csv_team_fees.csv");

    const season = matches[0]["Year Dates"];
    const feeRules = getFeeRules(feesCSV, season);

    const players = groupByPlayer(matches);
    const finalRows = players.map(p => calculateRow(p, feeRules));

    document.getElementById("divisionDisplay").textContent =
        "Division: " + players[0].Division;

    renderTable(finalRows);
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
