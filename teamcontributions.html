<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Contributions</title>

<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; }
  th { background: #eee; }
  .center { text-align: center; }
  .highlight { background: #7CFC00 !important; font-weight: bold; }
  #last-updated { margin-top: 10px; font-style: italic; }
</style>
</head>

<body>

<h2>Team Contributions</h2>
<div id="last-updated">Last updated: —</div>

<table>
  <thead>
    <tr>
      <th>Team Player</th>
      <th class="center">League Games</th>
      <th class="center">Cup Games</th>
      <th>League Fees</th>
      <th>Cup Fees</th>
      <th>Duck Fines</th>
      <th>Low Score Fines</th>
      <th>Legs Won</th>
      <th>Top Scores</th>
      <th>Net Owed</th>
    </tr>
  </thead>
  <tbody id="accountsBody"></tbody>
</table>

<script>
// ---------------------------
// Robust fetch helper
// ---------------------------
function fetchText(url){
  return fetch(url, { cache:"no-store" }).then(r => {
    if(!r.ok) throw new Error(url + " not found");
    return r.text();
  });
}

// ---------------------------
// Update Last Updated (same as ToCatch)
// ---------------------------
function updateLastUpdated(grid) {
  if (!grid || grid.length < 2) return;

  const header = grid[0];
  const idx = header.indexOf("UpdatedAt");
  if (idx === -1) return;

  const raw = String(grid[1][idx] || "").trim();
  if (!raw) return;

  let s = raw;
  const slash = s.indexOf("/");
  if (slash > 0 && /^[A-Za-z]+$/.test(s.slice(0, slash))) {
    s = s.slice(slash + 1);
  }

  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/);
  if (!m) return;

  const date = new Date(m[3], m[2] - 1, m[1], m[4], m[5]);

  const formatted = date.toLocaleString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  document.getElementById("last-updated").textContent =
    "Last updated: " + formatted;
}

// ---------------------------
// CSV Parsing
// ---------------------------
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const c = line[i];

    if (c === '"') {
      insideQuotes = !insideQuotes;
    } else if (c === ',' && !insideQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += c;
    }
  }

  result.push(current.trim());
  return result;
}

// ---------------------------
// MAIN LOAD
// ---------------------------
fetchText("csv_export.csv?v=" + Date.now())
  .then(text => {
    const rows = text.trim().split(/\r?\n/).map(parseCSVLine);

    updateLastUpdated(rows);

    const header = rows.shift();
    const idx = n => header.indexOf(n);

    const iPlayer    = idx("Semington A Player Name");
    const iDucks     = idx("Ducks");
    const iDetails   = idx("Match Details");
    const iMatchId   = idx("Match ID");
    const iUpdated   = idx("UpdatedAt");
    const iLeagueCup = idx("League/Cup");

    const iLeg1 = idx("Leg 1:");
    const iLeg2 = idx("Leg 2:");
    const iLeg3 = idx("Leg 3:");
    const iLeg4 = idx("Leg 4:");
    const iLeg5 = idx("Leg 5:");
    const iLeg6 = idx("Leg 6:");
    const iTotal = idx("Total Score");

    const players = {};
    const invalidPlayers = new Set([
      "O", "0", "A N Other", "A  N Other", "A N Others 4 and Under"
    ]);

    let totalLeagueFees = 0;
    let totalCupFees    = 0;
    let totalDuckFines  = 0;
    let totalLowFines   = 0;
    let totalLegsWon    = 0;
    let totalTopScores  = 0;

    const LOW_SCORE_LIMIT = 5;

    // Cup fee table
    const cupFeeByDate = {
      "19/09/2025": 2.00,
      "02/01/2026": 2.50,
      "30/01/2026": 2.00
    };

    // Group rows by match
    const matches = {};
    rows.forEach(r => {
      const matchId = r[iMatchId];
      if (!matchId) return;
      if (!matches[matchId]) matches[matchId] = [];
      matches[matchId].push(r);
    });

    // Process matches
    Object.values(matches).forEach(matchRows => {
      const realPlayers = matchRows.filter(r => !invalidPlayers.has(r[iPlayer]));

      // Determine leg winners
      for (let legIndex = 0; legIndex < 6; legIndex++) {
        let highest = -1;
        let winner = null;

        realPlayers.forEach(r => {
          const legScore = Number(r[iLeg1 + legIndex] || 0);
          if (legScore > highest) {
            highest = legScore;
            winner = r[iPlayer];
          }
        });

        if (winner) {
          if (!players[winner]) {
            players[winner] = {
              leagueGames: 0, cupGames: 0,
              leagueFees: 0, cupFees: 0,
              duckFines: 0, lowScoreFines: 0,
              legsWon: 0, topScores: 0,
              netOwed: 0
            };
          }
          players[winner].legsWon++;
        }
      }

      // Determine top score winner
      let topScore = -1;
      let topPlayer = null;

      realPlayers.forEach(r => {
        const total = Number(r[iTotal] || 0);
        if (total > topScore) {
          topScore = total;
          topPlayer = r[iPlayer];
        }
      });

      if (topPlayer) {
        if (!players[topPlayer]) {
          players[topPlayer] = {
            leagueGames: 0, cupGames: 0,
            leagueFees: 0, cupFees: 0,
            duckFines: 0, lowScoreFines: 0,
            legsWon: 0, topScores: 0,
            netOwed: 0
          };
        }
        players[topPlayer].topScores++;
      }

      // Process each row
      matchRows.forEach(r => {
        const originalPlayer = r[iPlayer];
        let player = originalPlayer;

        if (invalidPlayers.has(originalPlayer)) {
          return;
        }

        if (!players[player]) {
          players[player] = {
            leagueGames: 0, cupGames: 0,
            leagueFees: 0, cupFees: 0,
            duckFines: 0, lowScoreFines: 0,
            legsWon: 0, topScores: 0,
            netOwed: 0
          };
        }

        const p = players[player];
        const leagueCup = r[iLeagueCup] || "";
        const matchId = r[iMatchId] || "";

        if (leagueCup === "League") p.leagueGames++;
        if (leagueCup === "Cup")    p.cupGames++;

        p.leagueFees = p.leagueGames * 4;

        if (leagueCup === "Cup") {
          const datePart = matchId.split(" ")[0];
          const fee = cupFeeByDate[datePart] || 0;
          p.cupFees += fee;
        }

        const ducks = Number(r[iDucks] || 0);
        p.duckFines += ducks;

        const legs = [
          Number(r[iLeg1] || 0),
          Number(r[iLeg2] || 0),
          Number(r[iLeg3] || 0),
          Number(r[iLeg4] || 0),
          Number(r[iLeg5] || 0),
          Number(r[iLeg6] || 0)
        ];

        legs.forEach(l => {
          if (l > 0 && l < LOW_SCORE_LIMIT) {
            p.lowScoreFines++;
          }
        });

        p.netOwed =
          p.leagueFees +
          p.cupFees +
          p.duckFines +
          p.lowScoreFines;
      });
    });

    // Determine max values for highlighting
    let maxLegsWon = 0;
    let maxTopScores = 0;

    Object.values(players).forEach(p => {
      if (p.legsWon > maxLegsWon) maxLegsWon = p.legsWon;
      if (p.topScores > maxTopScores) maxTopScores = p.topScores;
    });

    // Totals
    Object.values(players).forEach(p => {
      totalLeagueFees += p.leagueFees;
      totalCupFees    += p.cupFees;
      totalDuckFines  += p.duckFines;
      totalLowFines   += p.lowScoreFines;
      totalLegsWon    += p.legsWon;
      totalTopScores  += p.topScores;
    });

    // Render table
    const body = document.getElementById("accountsBody");
    body.innerHTML = "";

    Object.keys(players).sort().forEach(name => {
      const p = players[name];

      const highlight =
        (p.legsWon === maxLegsWon || p.topScores === maxTopScores)
          ? 'class="highlight"'
          : '';

      body.innerHTML += `
        <tr ${highlight}>
          <td>${name}</td>
          <td class="center">${p.leagueGames}</td>
          <td class="center">${p.cupGames}</td>
          <td>£${p.leagueFees}</td>
          <td>£${p.cupFees.toFixed(2)}</td>
          <td>£${p.duckFines}</td>
          <td>£${p.lowScoreFines}</td>
          <td>${p.legsWon}</td>
          <td>${p.topScores}</td>
          <td>£${p.netOwed}</td>
        </tr>
      `;
    });

    // Totals row
    body.innerHTML += `
      <tr style="font-weight:bold; background:#f2f2f2;">
        <td>TOTALS</td>
        <td class="center">-</td>
        <td class="center">-</td>
        <td>£${totalLeagueFees}</td>
        <td>£${totalCupFees.toFixed(2)}</td>
        <td>£${totalDuckFines}</td>
        <td>£${totalLowFines}</td>
        <td>${totalLegsWon}</td>
        <td>${totalTopScores}</td>
        <td>£${totalLeagueFees + totalCupFees + totalDuckFines + totalLowFines}</td>
      </tr>
    `;
  });
</script>

</body>
</html>
