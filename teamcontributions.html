<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contributions</title>

  <style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background-color: #f5f0e6;
  }

  /* ===== HEADER ===== */
  header {
    padding: 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    margin: 0;
    font-size: 72px;
    text-align: center;
    flex: 1;
  }

  .logo img {
    width: 300px;
    height: auto;
  }

  .nav-buttons {
    margin-top: 15px;
    text-align: center;
  }

  .nav-buttons a {
    display: inline-block;
    margin: 6px;
    padding: 10px 18px;
    background: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
  }

  .nav-buttons a:hover {
    background: #163aa3;
  }

  /* Highlight active page */
  .nav-buttons a.active {
    background: #163aa3;
  }

  /* ===== MAIN ===== */
  main {
    flex: 1;
    padding: 20px;
  }

  #divisionDisplay {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 15px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffffcc;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #555;
    padding: 10px;
    text-align: center;
  }

  th {
    background: #ddd;
  }

  .win {
    background: #b6f2ad;
    font-weight: bold;
  }

  .paid {
    background: #f7c5c5;
    font-weight: bold;
  }

  .total {
    background: #fff4b3;
    font-weight: bold;
  }

  /* ===== FOOTER ===== */
  footer {
    margin-top: auto;
    text-align: center;
    padding: 16px 20px 22px;
    font-size: 12px;
    color: #555;
  }

  .footer-logo img {
    width: 60px;
    opacity: 0.9;
  }

  /* ===== MOBILE ===== */
  @media (max-width: 900px) {

    .header-top {
      flex-direction: column;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-top: 10px;
    }

    .logo img {
      width: 150px;
      margin-bottom: 10px;
    }

    table {
      font-size: 12px;
    }

    .footer-logo img {
      width: 48px;
    }
  }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Team Contributions</h1>

    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>

  <div class="nav-buttons">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures &amp; Results</a>
    <a href="match-results-v2.html">Match Results</a>
    <a href="tocatch.html">To Catch</a>
    <a href="gallery.html">Gallery</a>
    <a href="rules.html">Rules</a>
    <a href="teamcontributions.html" class="active">Team Contributions</a>
  </div>
</header>

<main>

  <div id="divisionDisplay"></div>

  <table id="contributionsTable"></table>

</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>

<script>
// Convert CSV values to numbers safely
function toNum(v) {
    return Number(String(v).replace(/[^0-9.-]/g, "")) || 0;
}

// Format money, blank if zero
function money(v) {
    return Number(v) === 0 ? "" : "£" + v;
}

// Load CSV file
async function loadCSV(file) {
    const response = await fetch(file);
    const text = await response.text();
    return parseCSV(text);
}

// Parse CSV into objects
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    return lines.slice(1).map(line => {
        const values = line.split(",");
        const row = {};
        headers.forEach((h, i) => row[h] = (values[i] || "").trim());
        return row;
    });
}

// Build season dropdown
function buildSeasonDropdown(rows) {
    const seasons = [...new Set(rows.map(r => r.Season))].filter(Boolean);

    const select = document.createElement("select");
    select.id = "seasonSelect";
    select.style.marginBottom = "15px";

    seasons.forEach(season => {
        const opt = document.createElement("option");
        opt.value = season;
        opt.textContent = season;
        select.appendChild(opt);
    });

    document.getElementById("divisionDisplay").before(select);

    select.addEventListener("change", init);
}

// Group match rows by player
function groupByPlayer(rows) {
    const players = {};

    rows.forEach(r => {
        const name = r["Semington A Player Name"];

        // Remove junk players
        if (!name || name === ")" || name === "A N Other" || name === "0") return;

        if (!players[name]) {
            players[name] = {
                Player: name,
                Division: r.Division.toLowerCase(),
                Ducks: 0,
                LegsWon: 0,
                TopScore: 0,
                Spares: 0,
                UnderCount: 0
            };
        }

        players[name].Ducks += toNum(r.Ducks);
        players[name].LegsWon += toNum(r["Legs Won "]);
        players[name].TopScore += toNum(r["Top Score"]);
        players[name].Spares += toNum(r.Spares);

        const legs = [
            toNum(r["Leg 1:"]),
            toNum(r["Leg 2: "]),
            toNum(r["Leg 3: "]),
            toNum(r["Leg 4: "]),
            toNum(r["Leg 5: "]),
            toNum(r["Leg 6:"])
        ];

        const threshold = r.Division.toLowerCase() === "premier" ? 5 : 6;
        players[name].UnderCount += legs.filter(l => l < threshold).length;
    });

    return Object.values(players);
}

// Extract fee rules for the season
function getFeeRules(feesCSV, season) {
    return feesCSV.find(r => r["Year Dates"] === season);
}

// Build final table rows
function calculateRow(player, fees) {
    const isPremier = player.Division === "premier";

    const duckValue = isPremier ? toNum(fees["Duck Value Premier"]) : toNum(fees["Duck Value Div 1"]);
    const underValue = isPremier ? toNum(fees["Under 5 Premier"]) : toNum(fees["Under 6 Div 1"]);

    const legsWonValue = toNum(fees["Legs won Value"]);
    const topScoreValue = toNum(fees["Top Score Value"]);
    const spareValue = toNum(fees["Spare Value"]);

    const leagueFees = toNum(fees["League Fees"]);
    const cupFees = toNum(fees["Cup Fees"]);

    // Earnings
    const legsWonMoney = player.LegsWon * legsWonValue;
    const topScoreMoney = player.TopScore * topScoreValue;
    const spareMoney = player.Spares * spareValue;

    const totalWin = legsWonMoney + topScoreMoney + spareMoney;

    // Payments
    const duckFine = player.Ducks * duckValue;
    const underFine = player.UnderCount * underValue;

    const totalPaid = duckFine + underFine + leagueFees + cupFees;

    return {
        Player: player.Player,
        LegsWon: legsWonMoney.toFixed(2),
        TopScore: topScoreMoney.toFixed(2),
        Spares: spareMoney.toFixed(2),
        TotalWin: totalWin.toFixed(2),
        Ducks: duckFine.toFixed(2),
        Under: underFine.toFixed(2),
        LeagueFees: leagueFees.toFixed(2),
        CupFees: cupFees.toFixed(2),
        TotalPaid: totalPaid.toFixed(2)
    };
}

// Render table
function renderTable(rows) {
    const table = document.getElementById("contributionsTable");
    table.innerHTML = "";

    const headers = [
        "Player",
        "Legs Won (£)",
        "Top Score (£)",
        "Spares (£)",
        "Total Win (£)",
        "Ducks (£)",
        "Under (£)",
        "League Fees (£)",
        "Cup Fees (£)",
        "Total Paid (£)"
    ];

    let headerRow = "<tr>";
    headers.forEach(h => headerRow += `<th>${h}</th>`);
    headerRow += "</tr>";
    table.innerHTML += headerRow;

    rows.forEach(r => {
        table.innerHTML += `
            <tr>
                <td>${r.Player}</td>
                <td class="win">${money(r.LegsWon)}</td>
                <td class="win">${money(r.TopScore)}</td>
                <td class="win">${money(r.Spares)}</td>
                <td class="win" style="background:#7CFF7C; color:#004400;">${money(r.TotalWin)}</td>
                <td class="paid">${money(r.Ducks)}</td>
                <td class="paid">${money(r.Under)}</td>
                <td class="paid">${money(r.LeagueFees)}</td>
                <td class="paid">${money(r.CupFees)}</td>
                <td class="paid" style="background:#FF7C7C; color:#660000;">${money(r.TotalPaid)}</td>
            </tr>
        `;
    });
}

// Init
async function init() {
    const matches = await loadCSV("csv_export.csv");
    const feesCSV = await loadCSV("csv_team_fees.csv");

    // Build dropdown once
    if (!document.getElementById("seasonSelect")) {
        buildSeasonDropdown(matches);
    }

    const season = document.getElementById("seasonSelect").value;
    const feeRules = getFeeRules(feesCSV, season);

    const filtered = matches.filter(r => r.Season === season);
    const players = groupByPlayer(filtered);
    const finalRows = players.map(p => calculateRow(p, feeRules));

    document.getElementById("divisionDisplay").textContent =
        "Division: " + players[0].Division;

    renderTable(finalRows);
}

document.addEventListener("DOMContentLoaded", init);
</script>



</body>
</html>
