<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contributions - Semington A (Test)</title>

    <!-- FAVICONS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Semington-a-test/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Semington-a-test/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Semington-a-test/favicon-16x16.png">
    <link rel="manifest" href="/Semington-a-test/site.webmanifest">
    <link rel="shortcut icon" href="/Semington-a-test/favicon.ico">

    <style>
        body {
            margin: 0;
            background-color: #f5f0e6;
            color: black;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: black;
            position: relative;
        }

        .top-right-logo {
            position: absolute;
            top: 10px;
            right: 20px;
            height: 80px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 0;
            background-color: #222;
        }

        .navbar a {
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            font-size: 18px;
            background-color: #222;
            border-radius: 4px;
        }

        .navbar a:hover {
            background-color: #444;
        }

        .navbar .active {
            background-color: #008CBA;
        }

        .content {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
            flex: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        #divisionDisplay {
            font-weight: bold;
            margin-bottom: 10px;
        }

        #contributionsTable {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        #contributionsTable th,
        #contributionsTable td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }

        #contributionsTable th {
            background-color: #ddd;
        }

        .win {
            background-color: #b6f2ad;
            color: #0a4d00;
            font-weight: 600;
            padding: 4px 6px;
        }

        .paid {
            background-color: #f7c5c5;
            color: #7a0000;
            font-weight: 600;
            padding: 4px 6px;
        }

        .total {
            background-color: #fff4b3;
            font-weight: 700;
            padding: 4px 6px;
        }

        .footer {
            text-align: center;
            padding: 10px 0;
            color: black;
        }

        .footer-logo {
            height: 40px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header {
                font-size: 28px;
                padding: 15px 10px;
            }

            .top-right-logo {
                height: 50px;
                top: 8px;
                right: 10px;
            }

            .navbar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px 5px;
            }

            .navbar a {
                font-size: 16px;
                padding: 8px 12px;
            }

            .content {
                padding: 15px;
            }

            #contributionsTable {
                overflow-x: auto;
                min-width: 600px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        Team Contributions
        <img src="Semington A Logo 5.jpg" alt="Semington A Skittles Team Logo" class="top-right-logo">
    </header>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#" class="active">Contributions</a>
        <a href="#">Fixtures</a>
    </nav>

    <div class="content">
        <h2>Team Contributions</h2>

        <div id="divisionDisplay"></div>

        <table id="contributionsTable"></table>
    </div>

    <footer class="footer">
        Semington A Skittles
    </footer>

    <script>
    // Load a CSV file and return array of row objects
    async function loadCSV(file) {
        const response = await fetch(file);
        const text = await response.text();
        return parseCSV(text);
    }

    function parseCSV(text) {
        const lines = text.trim().split("\n");
        const headers = lines[0].split(",").map(h => h.trim());

        return lines.slice(1).map(line => {
            const values = line.split(",");
            const row = {};
            headers.forEach((h, i) => row[h] = (values[i] || "").trim());
            return row;
        });
    }

    // Merge main + extras by Player
    function mergeData(main, extras) {
        const map = new Map();

        main.forEach(row => {
            if (!row.Player) return;
            map.set(row.Player, { ...row });
        });

        extras.forEach(row => {
            if (!row.Player) return;
            if (map.has(row.Player)) {
                Object.assign(map.get(row.Player), row);
            } else {
                map.set(row.Player, { ...row });
            }
        });

        return Array.from(map.values());
    }

    // Show Division at top
    function showDivision(data) {
        const div = document.getElementById("divisionDisplay");
        if (!div || data.length === 0) return;

        const division = data[0].Division || "";
        div.textContent = `Division: ${division}`;
    }

    // Calculate row values based on Division
    function calculateRow(row) {
        const division = row.Division;

        // Division-based values
        const duckValue = division === "Premier" ? 0.5 : 2;
        const underThreshold = division === "Premier" ? 5 : 6;

        // Ducks
        const ducks = Number(row.Ducks || 0);
        const duckFine = ducks * duckValue;

        // Under-5 or Under-6
        const legs = [
            Number(row.Leg1 || 0),
            Number(row.Leg2 || 0),
            Number(row.Leg3 || 0),
            Number(row.Leg4 || 0),
            Number(row.Leg5 || 0),
            Number(row.Leg6 || 0)
        ];

        const lowScores = legs.filter(l => l < underThreshold).length;
        const lowScoreFine = lowScores * duckValue;

        // Wins
        const legsWon = Number(row["Legs Won"] || 0) * 0.5;
        const topScore = Number(row["Top Score"] || 0) * 0.5;
        const spares = Number(row.Spares || 0) * 0.5;

        // Fees (from extras CSV)
        const leagueFees = Number(row["League Fees"] || 0);
        const cupFees = Number(row["Cup Fees"] || 0);

        // Totals
        const totalWin = legsWon + topScore + spares;
        const totalPaid = duckFine + lowScoreFine + leagueFees + cupFees;
        const net = totalWin - totalPaid;

        return {
            Player: row.Player,
            LegsWon: legsWon,
            TopScore: topScore,
            Spares: spares,
            DucksPrem: division === "Premier" ? duckFine : 0,
            DucksDiv1: division === "Div 1" ? duckFine : 0,
            Under5Prem: division === "Premier" ? lowScoreFine : 0,
            Under6Div1: division === "Div 1" ? lowScoreFine : 0,
            LeagueFees: leagueFees,
            CupFees: cupFees,
            TotalWin: totalWin,
            Net: net
        };
    }

    // Build table
    function renderTable(data) {
        const table = document.getElementById("contributionsTable");
        table.innerHTML = "";

        if (!data || data.length === 0) {
            table.innerHTML = "<tr><td>No data available</td></tr>";
            return;
        }

        const headers = [
            "Player",
            "Legs Won (£)",
            "Top Score (£)",
            "Spares (£)",
            "Ducks Prem (£)",
            "Ducks Div1 (£)",
            "Under-5 Prem (£)",
            "Under-6 Div1 (£)",
            "League Fees (£)",
            "Cup Fees (£)",
            "Total Win (£)",
            "Total Net Paid (£)"
        ];

        let headerRow = "<tr>";
        headers.forEach(h => headerRow += `<th>${h}</th>`);
        headerRow += "</tr>";
        table.innerHTML += headerRow;

        data.forEach(rawRow => {
            const row = calculateRow(rawRow);

            let rowHTML = "<tr>";
            rowHTML += `<td>${row.Player}</td>`;
            rowHTML += `<td class="win">£${row.LegsWon.toFixed(2)}</td>`;
            rowHTML += `<td class="win">£${row.TopScore.toFixed(2)}</td>`;
            rowHTML += `<td class="win">£${row.Spares.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.DucksPrem.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.DucksDiv1.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.Under5Prem.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.Under6Div1.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.LeagueFees.toFixed(2)}</td>`;
            rowHTML += `<td class="paid">£${row.CupFees.toFixed(2)}</td>`;
            rowHTML += `<td class="total">£${row.TotalWin.toFixed(2)}</td>`;
            rowHTML += `<td class="total">£${row.Net.toFixed(2)}</td>`;
            rowHTML += "</tr>";

            table.innerHTML += rowHTML;
        });
    }

    // Init
    async function init() {
        // Adjust filenames if yours differ
        const main = await loadCSV("main.csv");
        const extras = await loadCSV("extras.csv");

        const merged = mergeData(main, extras);
        showDivision(merged);
        renderTable(merged);
    }

    document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
