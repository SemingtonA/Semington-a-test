<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    .fixtures-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  gap: 12px;
}

.fixtures-header h2 {
  margin: 0;
}

.last-updated {
  font-size: 12px;
  color: #555;
  white-space: nowrap;
}
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    th.points,
    td.points {
    text-align: center;
    white-space: nowrap;
   }

    col.points {
    text-align: center;
   }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
    @media (max-width: 900px) {
  .fixtures-header {
    flex-direction: column;
    align-items: flex-start;
  }
}
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Fixtures & Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>
  
 <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>

  <div class="league-results-row">
    <div class="league-label">League Results</div>
    <div class="result-boxes">
      <div class="result-box win">Wins: <span id="winCount">0</span></div>
      <div class="result-box draw">Draws: <span id="drawCount">0</span></div>
      <div class="result-box loss">Losses: <span id="lossCount">0</span></div>
    </div>
    <div class="result-box total">
      Total League Points: <span id="pointsTotal">0</span>
    </div>
  </div>
</header>

<main>
  <div class="content-box">
    <div class="fixtures-header">
  <h2>Fixtures</h2>
  <div id="lastUpdated" class="last-updated">
    Last updated: —
  </div>

   
  <table>

  <colgroup>
    <col>
    <col>
    <col>
    <col>
    <col class="points">
    <col>
    <col>
    <col>
  </colgroup>

  <thead>
    <tr>
      <th>Date</th>
      <th>Day</th>
      <th>Fixture</th>
      <th>Scores</th>
      <th class="points">Points</th>
      <th>Venue</th>
      <th>Competition</th>
      <th>Alley</th>
    </tr>
  </thead>

  <tbody id="fixturesBody">
    <!-- rows injected by JS -->
  </tbody>

</table> 
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>
<script>
(function () {

  function clean(v) { return v == null ? "" : String(v).trim(); }
  function splitRow(line) { return line.split(","); }

  function toHalfNum(s) {
    if (!s) return NaN;
    s = String(s).replace(/\s+/g, "").replace("½", ".5");
    s = s.replace(/(\d+)1\/2/g, "$1.5");
    return Number(s);
  }

  function parseUpdatedAt(v) {
    if (!v) return null;
    // accepts: Sun/19/04/2026 11:04
    var m = v.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (!m) return null;
    return new Date(m[3], m[2] - 1, m[1]);
  }

  var tbody = document.getElementById("fixturesBody");
  if (!tbody) return;

  fetch("fixtures_web.csv?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.text())
    .then(text => {

      var lines = text.split(/\r?\n/).map(l => l.trim());
      var headerLine = -1;

      for (var i = 0; i < lines.length; i++) {
        if (lines[i].startsWith("Date:")) {
          headerLine = i;
          break;
        }
      }
      if (headerLine === -1) return;

      var header = splitRow(lines[headerLine]).map(clean);
      var idx = name => header.indexOf(name);

      var iDate = idx("Date:");
      var iDay = idx("Day");
      var iHome = idx("Home Team");
      var iAway = idx("Away Team");
      var iHomeScore = idx("Home Score");
      var iAwayScore = idx("Away Score");
      var iHomePts = idx("Home Points");
      var iAwayPts = idx("Away Points");
      var iLoc = idx("Location");
      var iAlley = idx("Alley");
      var iComp = idx("Match Details");
      var iUpdated = idx("UpdatedAt");

      var latestUpdated = null;

      tbody.innerHTML = "";

      for (var r = headerLine + 1; r < lines.length; r++) {
        if (!lines[r]) continue;

        var row = splitRow(lines[r]).map(clean);
        if (!row[iDate]) continue;

        var hs = toHalfNum(row[iHomeScore]);
        var as = toHalfNum(row[iAwayScore]);
        var hp = toHalfNum(row[iHomePts]);
        var ap = toHalfNum(row[iAwayPts]);

        var scoreText = (Number.isFinite(hs) && Number.isFinite(as)) ? hs + "–" + as : "";
        var ptsText = (Number.isFinite(hp) && Number.isFinite(ap)) ? hp + "–" + ap : "";

        if (row[iUpdated]) latestUpdated = row[iUpdated];

        var tr = document.createElement("tr");
        if (/cup/i.test(row[iComp])) tr.classList.add("cup-match");

        tr.innerHTML =
          "<td>" + row[iDate] + "</td>" +
          "<td>" + row[iDay] + "</td>" +
          "<td>" + row[iHome] + " vs " + row[iAway] + "</td>" +
          "<td>" + scoreText + "</td>" +
          "<td class='points'>" + ptsText + "</td>" +
          "<td>" + row[iLoc] + "</td>" +
          "<td>" + row[iComp] + "</td>" +
          "<td>" + row[iAlley] + "</td>";

        tbody.appendChild(tr);
      }

      // ---------- STATS ----------
      var wins = 0, draws = 0, losses = 0, totalPoints = 0;

      Array.from(tbody.querySelectorAll("tr")).forEach(tr => {
        var tds = tr.querySelectorAll("td");
        if (!tds.length) return;

        var comp = tds[6].textContent.toLowerCase();
        if (comp.includes("cup")) return;

        var pts = tds[4].textContent.split("–");
        if (pts.length !== 2) return;

        var homePts = Number(pts[0]);
        var awayPts = Number(pts[1]);

        var fixture = tds[2].textContent;
        var myPts =
          /semington a/i.test(fixture.split(" vs ")[0]) ? homePts :
          /semington a/i.test(fixture.split(" vs ")[1]) ? awayPts : null;

        if (!Number.isFinite(myPts)) return;

        totalPoints += myPts;

        if (myPts === 3.5) { draws++; tr.classList.add("_draw"); }
        else if (myPts > 3.5) { wins++; tr.classList.add("_win"); }
        else { losses++; tr.classList.add("_loss"); }
      });

      document.getElementById("winCount").textContent = wins;
      document.getElementById("drawCount").textContent = draws;
      document.getElementById("lossCount").textContent = losses;
      document.getElementById("pointsTotal").textContent = totalPoints.toFixed(1);

      // ---------- LAST UPDATED ----------
      var d = parseUpdatedAt(latestUpdated) || new Date();
      document.getElementById("lastUpdated").textContent =
        "Last updated: " +
        d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

    });

})();
</script>
  


        </body>
        </html>
