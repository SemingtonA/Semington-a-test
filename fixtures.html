<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
  </style>
</head>

  function clean(v) { return (v === undefined || v === null) ? "" : String(v).trim(); }

  // Quote-aware CSV parser (safe with commas)
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var cur = "";
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var c = text[i];

      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        row.push(cur); cur = "";
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = "";
        // keep non-empty lines
        var any = false;
        for (var k = 0; k < row.length; k++) if (clean(row[k]) !== "") { any = true; break; }
        if (any) rows.push(row);
        row = [];
      } else {
        cur += c;
      }
    }
    if (cur.length || row.length) {
      row.push(cur);
      var any2 = false;
      for (var k2 = 0; k2 < row.length; k2++) if (clean(row[k2]) !== "") { any2 = true; break; }
      if (any2) rows.push(row);
    }
    return rows;
  }

  // Half-point parser: "6 1/2"->6.5, "1/2"->0.5, "½"->.5

    s = s.replace(/(\d+)1\/2/g, "$1.5");
