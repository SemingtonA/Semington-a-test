<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Fixtures & Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>
  
 <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>


  <div id="lastUpdated" style="text-align:center; font-size:12px; margin-top:10px;">
    Last updated: —
  </div>

  <div class="league-results-row">
    <div class="league-label">League Results</div>
    <div class="result-boxes">
      <div class="result-box win">Wins: <span id="winCount">0</span></div>
      <div class="result-box draw">Draws: <span id="drawCount">0</span></div>
      <div class="result-box loss">Losses: <span id="lossCount">0</span></div>
    </div>
    <div class="result-box total">
      Total League Points: <span id="pointsTotal">0</span>
    </div>
  </div>
</header>

<main>
  <div class="content-box">
    <h2>Fixtures</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th>Fixture</th>
          <th>Scores</th>
          <th class="points">Points</th>
          <th>Venue</th>
          <th>Competition</th>
          <th>Alley</th>
        </tr>
      </thead>
      <tbody id="fixturesBody"></tbody>
    </table>
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>

<script>
(function () {

  /* ======================================================
     STEP 1: BUILD TABLE FROM CSV (NO LOGIC HERE)
     ====================================================== */

  function clean(v){ return (v==null?"":String(v).trim()); }

  fetch("fixtures_web.csv?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.text())
    .then(text => {

      const tbody = document.getElementById("fixturesBody");
      tbody.innerHTML = "";

      const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.toLowerCase().startsWith("fixtures and scores"));

      // Header row = line starting with Date:
      const h = lines.findIndex(l => l.startsWith("Date:"));
      if (h === -1) return;

      const rows = lines.slice(h + 1)
        .filter(l => !l.toLowerCase().startsWith("league matches"));

      rows.forEach(line => {
        const c = line.split(",");

        const date = clean(c[0]);
        if (!date) return;

        const day   = clean(c[1]);
        const home  = clean(c[2]);
        const away  = clean(c[8]);
        const venue = clean(c[9]);
        const alley = clean(c[10]);
        const comp  = clean(c[14]);

        const p1 = clean(c[4]);
        const p2 = clean(c[6]);

        const ptsText = p1 && p2 ? `${p1}–${p2}` : "";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${date}</td>
          <td>${day}</td>
          <td>${home} vs ${away}</td>
          <td></td>
          <td class="points">${ptsText}</td>
          <td>${venue}</td>
          <td>${comp}</td>
          <td>${alley}</td>
        `;
        tbody.appendChild(tr);
      });

      /* ======================================================
         STEP 2: RUN LIVE SITE LOGIC *UNCHANGED*
         ====================================================== */

      function toHalfNum(s) {
        if (!s) return NaN;
        s = String(s).trim().replace(/\s+/g,"").replace(/½/g,".5");
        if (s==="1/2") return 0.5;
        s = s.replace(/(\d+)1\/2/g,"$1.5");
        var n = Number(s);
        return Number.isFinite(n)?n:NaN;
      }

      function parsePoints(text) {
        if (!text) return null;
        var p=text.split(/[-–—]/).map(v=>v.trim());
        if (p.length!==2) return null;
        var a=toHalfNum(p[0]), b=toHalfNum(p[1]);
        return (Number.isFinite(a)&&Number.isFinite(b))?{l:a,r:b}:null;
      }

      const headers = Array.from(document.querySelectorAll("thead th"))
        .map(th => th.textContent.trim().toLowerCase());

      const fixtureIdx = headers.indexOf("fixture");
      const pointsIdx  = headers.indexOf("points");
      const compIdx    = headers.indexOf("competition");

      let wins=0,draws=0,losses=0,total=0;

      document.querySelectorAll("tbody tr").forEach(tr=>{
        const td=[...tr.querySelectorAll("td")];
        const competition=td[compIdx].textContent.toLowerCase();
        if(competition.includes("cup")){
          tr.classList.add("cup-match");
          return;
        }

        const ptsTxt=td[pointsIdx].textContent.trim();
        if(!ptsTxt) return;

        const pair=parsePoints(ptsTxt);
        if(!pair) return;

        const teams=td[fixtureIdx].textContent.split(/\s+vs\s+/i);
        if(teams.length<2) return;

        let myPts=NaN;
        if(/semington a/i.test(teams[0])) myPts=pair.l;
        else if(/semington a/i.test(teams[1])) myPts=pair.r;
        else return;

        total+=myPts;
        if(myPts>3.5){ wins++; tr.classList.add("_win"); }
        else if(myPts<3.5){ losses++; tr.classList.add("_loss"); }
        else{ draws++; tr.classList.add("_draw"); }
      });

      winCount.textContent=wins;
      drawCount.textContent=draws;
      lossCount.textContent=losses;
      pointsTotal.textContent=total.toFixed(1);
    });

})();
</script>


        </body>
        </html>
