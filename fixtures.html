<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====================== -->
  <!-- PAGE METADATA -->
  <!-- ====================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures &amp; Results</title>

  <style>
    /* ====================== */
    /* GLOBAL PAGE STYLES */
    /* ====================== */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ====================== */
    /* HEADER AREA */
    /* ====================== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    /* Club logo (top right) */
    .logo img {
      width: 300px;
      height: auto;
    }

    /* ====================== */
    /* NAVIGATION BUTTONS */
    /* ====================== */
    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ====================== */
    /* LEAGUE RESULTS SUMMARY */
    /* (Wins / Draws / Losses / Points) */
    /* ====================== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label {
      font-weight: bold;
      font-size: 30px;
    }

    .result-boxes {
      display: flex;
      gap: 10px;
    }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }

    .result-box.total {
      border: 2px solid #000;
      padding: 8px 12px;
    }

    /* ====================== */
    /* MAIN CONTENT AREA */
    /* ====================== */
    main {
      flex: 1;
      padding: 20px;
    }

    /* White container around fixtures table */
    .content-box {
      background: #fff;
      max-width: 100%;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    /* ====================== */
    /* FIXTURES TABLE */
    /* ====================== */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    /* ====================== */
    /* FOOTER */
    /* ====================== */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px 20px 22px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; height: auto; }

    /* ====================== */
    /* MOBILE RESPONSIVE */
    /* ====================== */
    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; margin-bottom: 10px; }
      th, td { font-size: 12px; }
      .footer-logo img { width: 48px; }
    }

    /* ====================== */
    /* ROW HIGHLIGHTING */
    /* ====================== */
    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }

    /* Cup matches highlighted */
    tr.cup-match td { background-color: #e6f2ff; }
  </style>
</head>

    </div>
  </footer>

  <script>

</body>
</html>
