<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Fixtures & Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>
  
 <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>


  <div id="lastUpdated" style="text-align:center; font-size:12px; margin-top:10px;">
    Last updated: —
  </div>

  <div class="league-results-row">
    <div class="league-label">League Results</div>
    <div class="result-boxes">
      <div class="result-box win">Wins: <span id="winCount">0</span></div>
      <div class="result-box draw">Draws: <span id="drawCount">0</span></div>
      <div class="result-box loss">Losses: <span id="lossCount">0</span></div>
    </div>
    <div class="result-box total">
      Total League Points: <span id="pointsTotal">0</span>
    </div>
  </div>
</header>

<main>
  <div class="content-box">
    <h2>Fixtures</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th>Fixture</th>
          <th>Scores</th>
          <th class="points">Points</th>
          <th>Venue</th>
          <th>Competition</th>
          <th>Alley</th>
        </tr>
      </thead>
      <tbody id="fixturesBody"></tbody>
    </table>
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>
  
<script>
(function () {
  // ---------- helpers ----------
  function clean(v) {
    return (v === undefined || v === null) ? "" : String(v).trim();
  }

  // Quote-aware CSV parser (handles commas safely)
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var cur = "";
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var c = text[i];

      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        row.push(cur); cur = "";
      } else if ((c === '\n' || c === '\r') && !inQuotes) {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = "";
        // keep non-empty rows
        if (row.some(function(x){ return clean(x) !== ""; })) rows.push(row);
        row = [];
      } else {
        cur += c;
      }
    }
    if (cur.length || row.length) {
      row.push(cur);
      if (row.some(function(x){ return clean(x) !== ""; })) rows.push(row);
    }
    return rows;
  }

  // Half-point parser: "6 1/2" -> 6.5, "1/2" -> 0.5, "½" -> .5
  function toHalfNum(s) {
    s = clean(s);
    if (!s) return NaN;

    s = s.replace(/\s+/g, "");
    s = s.replace(/½/g, ".5");
    if (s === "1/2") return 0.5;
    s = s.replace(/(\d+)1\/2/g, "$1.5");

    var n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  // dd/mm/yyyy HH:MM -> Date
  function parseDMY(dateTime) {
    var dpart = clean(dateTime).split(" ")[0]; // "16/04/2026"
    var p = dpart.split("/");
    if (p.length !== 3) return null;
    return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
  }

  // Find header row by looking for "Date" or "Date:"
  function findHeaderRow(rows) {
    for (var i = 0; i < rows.length; i++) {
      for (var j = 0; j < rows[i].length; j++) {
        var h = clean(rows[i][j]).toLowerCase();
        if (h === "date" || h === "date:") return i;
      }
    }
    return -1;
  }

  // Get first and second occurrence of a header name (for duplicate columns like Points/Score)
  function indexOfHeader(headers, name, startAt) {
    var target = name.toLowerCase();
    for (var i = startAt || 0; i < headers.length; i++) {
      if (headers[i].toLowerCase() === target) return i;
    }
    return -1;
  }

  // ---------- elements ----------
  var tbody = document.getElementById("fixturesBody");
  var lastUpdatedEl = document.getElementById("lastUpdated");

  if (!tbody) return;

  // ---------- load CSV (cache-busted for GitHub Pages) ----------
  fetch("fixtures_web.csv?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("fixtures_web.csv not found (" + r.status + ")");
      return r.text();
    })
    .then(function (text) {

      var rows = parseCSV(text);

      // Find the real header row (your file has title/blank rows above it) 
      var headerRow = findHeaderRow(rows);
      if (headerRow < 0) throw new Error("Header row not found in fixtures_web.csv");

      var headers = rows[headerRow].map(function (h) { return clean(h); });
      var dataRows = rows.slice(headerRow + 1);

      // Stop if we hit the summary block at the bottom ("League Matches...") 
      var filtered = [];
      for (var r = 0; r < dataRows.length; r++) {
        var first = clean(dataRows[r][0]).toLowerCase();
        if (first.indexOf("league matches") === 0) break;
        filtered.push(dataRows[r]);
      }
      dataRows = filtered;

      // Indices (support BOTH old and new header styles) 
      var iDate = indexOfHeader(headers, "Date:", 0);
      if (iDate === -1) iDate = indexOfHeader(headers, "Date", 0);

      var iDay = indexOfHeader(headers, "Day", 0);
      var iHomeTeam = indexOfHeader(headers, "Home Team", 0);
      var iAwayTeam = indexOfHeader(headers, "Away Team", 0);
      var iLocation = indexOfHeader(headers, "Location", 0);
      var iAlley = indexOfHeader(headers, "Alley", 0);
      var iComp = indexOfHeader(headers, "Match Details", 0);
      if (iComp === -1) iComp = indexOfHeader(headers, "Competition", 0);

      // UpdatedAt
      var iUpdated = indexOfHeader(headers, "UpdatedAt", 0);
      if (iUpdated === -1) iUpdated = indexOfHeader(headers, "Updated At", 0);

      // NEW format support
      var iHomeScore = indexOfHeader(headers, "Home Score", 0);
      var iAwayScore = indexOfHeader(headers, "Away Score", 0);
      var iHomePts = indexOfHeader(headers, "Home Points", 0);
      var iAwayPts = indexOfHeader(headers, "Away Points", 0);

      // OLD format fallback: Score, Points appear twice
      var iScore1 = indexOfHeader(headers, "Score", 0);
      var iScore2 = (iScore1 !== -1) ? indexOfHeader(headers, "Score", iScore1 + 1) : -1;

      var iPts1 = indexOfHeader(headers, "Points", 0);
      var iPts2 = (iPts1 !== -1) ? indexOfHeader(headers, "Points", iPts1 + 1) : -1;

      // ---------- render ----------
      tbody.innerHTML = "";

      var win = 0, draw = 0, loss = 0, totalPoints = 0;
      var latestUpdated = "";

      for (var k = 0; k < dataRows.length; k++) {
        var row = dataRows[k];

        // Skip empty rows
        if (!clean(row[iDate])) continue;

        var dateStr = clean(row[iDate]);
        var dayStr = clean(row[iDay]);
        var homeTeam = clean(row[iHomeTeam]);
        var awayTeam = clean(row[iAwayTeam]);
        var comp = clean(row[iComp]);
        var venue = clean(row[iLocation]);
        var alley = clean(row[iAlley]);

        // Read score/points in either format
        var homeScoreStr = "";
        var awayScoreStr = "";
        var homePtsStr = "";
        var awayPtsStr = "";

        if (iHomeScore !== -1 && iAwayScore !== -1) {
          // new headers
          homeScoreStr = clean(row[iHomeScore]);
          awayScoreStr = clean(row[iAwayScore]);
        } else if (iScore1 !== -1 && iScore2 !== -1) {
          // old headers
          homeScoreStr = clean(row[iScore1]);
          awayScoreStr = clean(row[iScore2]);
        }

        if (iHomePts !== -1 && iAwayPts !== -1) {
          homePtsStr = clean(row[iHomePts]);
          awayPtsStr = clean(row[iAwayPts]);
        } else if (iPts1 !== -1 && iPts2 !== -1) {
          homePtsStr = clean(row[iPts1]);
          awayPtsStr = clean(row[iPts2]);
        }

        var homePtsNum = toHalfNum(homePtsStr);
        var awayPtsNum = toHalfNum(awayPtsStr);

        // Determine Semington's points (NaN means "not played / no points yet")
        var myPts = NaN;
        if (/semington a/i.test(homeTeam)) myPts = homePtsNum;
        else if (/semington a/i.test(awayTeam)) myPts = awayPtsNum;

        var tr = document.createElement("tr");

        // Highlight cup matches but do NOT count them
        if (/cup/i.test(comp)) {
          tr.classList.add("cup-match");
        }

        // Only count played LEAGUE matches (live site behaviour)
// - Cup matches are excluded
// - Unplayed matches stay white (myPts is NaN)
if (!/cup/i.test(comp) && Number.isFinite(myPts)) {
  totalPoints += myPts;

  if (myPts > 3.5) { win++; tr.classList.add("_win"); }
  else if (myPts < 3.5) { loss++; tr.classList.add("_loss"); }
  else { draw++; tr.classList.add("_draw"); }
}
          
          to// Count ONLY real, played league fixtures
          if (
            !/cup/i.test(comp) &&
            Number.isFinite(myPts) &&
            dateStr &&                     // real date present
            !/^league matches/i.test(dateStr)
            ) {talPoints += myPts;

          if (myPts > 3.5) { win++; tr.classList.add("_win"); }
          else if (myPts < 3.5) { loss++; tr.classList.add("_loss"); }
          else { draw++; tr.classList.add("_draw"); }
        }

        // Display text (blank if unplayed)
        var scoreText = (homeScoreStr && awayScoreStr) ? (homeScoreStr + "–" + awayScoreStr) : "";
        var ptsText = (homePtsStr && awayPtsStr) ? (homePtsStr + "–" + awayPtsStr) : "";

        // UpdatedAt tracking
        if (iUpdated !== -1) {
          var up = clean(row[iUpdated]);
          if (up && up > latestUpdated) latestUpdated = up;
        }

        tr.innerHTML =
          "<td>" + dateStr + "</td>" +
          "<td>" + dayStr + "</td>" +
          "<td>" + homeTeam + " vs " + awayTeam + "</td>" +
          "<td>" + scoreText + "</td>" +
          "<td class=\"points\">" + ptsText + "</td>" +
          "<td>" + venue + "</td>" +
          "<td>" + comp + "</td>" +
          "<td>" + alley + "</td>";

        tbody.appendChild(tr);
      }

      // Update counters
      document.getElementById("winCount").textContent = String(win);
      document.getElementById("drawCount").textContent = String(draw);
      document.getElementById("lossCount").textContent = String(loss);
      document.getElementById("pointsTotal").textContent = totalPoints.toFixed(1);

      // UpdatedAt display (dd/mm/yyyy parsing)
      if (lastUpdatedEl && latestUpdated) {
        var d = parseDMY(latestUpdated);
        if (d) {
          lastUpdatedEl.textContent =
            "Last updated: " +
            d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        }
      }
    })
    .catch(function (e) {
      // If anything fails, show it in the "Last updated" line so you see the error on-page
      if (lastUpdatedEl) lastUpdatedEl.textContent = "Last updated: (error loading fixtures)";
      console.error(e);
    });

})();
</script>

</body>
</html>
