<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Fixtures & Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>
  
 <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>


  <div id="lastUpdated" style="text-align:center; font-size:12px; margin-top:10px;">
    Last updated: —
  </div>

  <div class="league-results-row">
    <div class="league-label">League Results</div>
    <div class="result-boxes">
      <div class="result-box win">Wins: <span id="winCount">0</span></div>
      <div class="result-box draw">Draws: <span id="drawCount">0</span></div>
      <div class="result-box loss">Losses: <span id="lossCount">0</span></div>
    </div>
    <div class="result-box total">
      Total League Points: <span id="pointsTotal">0</span>
    </div>
  </div>
</header>

<main>
  <div class="content-box">
    <h2>Fixtures</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th>Fixture</th>
          <th>Scores</th>
          <th class="points">Points</th>
          <th>Venue</th>
          <th>Competition</th>
          <th>Alley</th>
        </tr>
      </thead>
      <tbody id="fixturesBody"></tbody>
    </table>
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>

<script>
(function () {

  function clean(v) {
    return v == null ? "" : String(v).trim();
  }

  fetch("fixtures_web.csv?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.text())
    .then(text => {

      const tbody = document.getElementById("fixturesBody");
      tbody.innerHTML = "";

      const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.toLowerCase().startsWith("fixtures and scores"));

      // Find header row
      const h = lines.findIndex(l => l.startsWith("Date:"));
      if (h === -1) return;

      const rows = lines
        .slice(h + 1)
        .filter(l => !l.toLowerCase().startsWith("league matches"));

      rows.forEach(line => {
        const c = line.split(",");

        const date = clean(c[0]);
        if (!date) return;

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${date}</td>
          <td>${clean(c[1])}</td>
          <td>${clean(c[2])} vs ${clean(c[8])}</td>
          <td>${clean(c[3]) && clean(c[7]) ? clean(c[3]) + "–" + clean(c[7]) : ""}</td>
          <td class="points">${clean(c[4]) && clean(c[6]) ? clean(c[4]) + "–" + clean(c[6]) : ""}</td>
          <td>${clean(c[9])}</td>
          <td>${clean(c[14])}</td>
          <td>${clean(c[10])}</td>
        `;

        // Cup row highlight only
        if (clean(c[14]).toLowerCase().includes("cup")) {
          tr.classList.add("cup-match");
        }

        tbody.appendChild(tr);
      });

      // reset counters for now
      winCount.textContent = "0";
      drawCount.textContent = "0";
      lossCount.textContent = "0";
      pointsTotal.textContent = "0";
    });

})();
</script>
``


        </body>
        </html>
