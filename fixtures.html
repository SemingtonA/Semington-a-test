<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures & Results</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ===== HEADER ===== */
    header { padding: 20px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img { width: 300px; height: auto; }

    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover { background: #163aa3; }

    /* ===== LEAGUE RESULTS STRIP ===== */
    .league-results-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .league-label { font-weight: bold; font-size: 30px; }

    .result-boxes { display: flex; gap: 10px; }

    .result-box {
      background: #000;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
    }

    .result-box.win   { border: 2px solid #1e8449; }
    .result-box.draw { border: 2px solid #f1c40f; }
    .result-box.loss { border: 2px solid #c0392b; }
    .result-box.total { border: 2px solid #000; }

    /* ===== MAIN ===== */
    main { flex: 1; padding: 20px; }

    .content-box {
      background: #fff;
      margin: 0 auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f0f0f0; text-align: left; }
    td.points { text-align: center; white-space: nowrap; }

    tr._win td  { background: #e8f8f1; }
    tr._loss td { background: #fdecea; }
    tr._draw td { background: #fff8e1; }
    tr.cup-match td { background: #e6f2ff; }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img { width: 60px; }

    @media (max-width: 900px) {
      .header-top { flex-direction: column; text-align: center; }
      header h1 { font-size: 32px; margin-top: 10px; }
      .logo img { width: 150px; }
      th, td { font-size: 12px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>Fixtures & Results</h1>
    <div class="logo">
      <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
    </div>
  </div>
  
 <div class="nav-buttons">
      <a href="index.html">Home</a>
      <a href="fixtures.html">Fixtures & Results</a>
      <a href="match-results-v2.html">Match Results</a>
      <a href="tocatch.html">To Catch</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
    </div>


  <div id="lastUpdated" style="text-align:center; font-size:12px; margin-top:10px;">
    Last updated: —
  </div>

  <div class="league-results-row">
    <div class="league-label">League Results</div>
    <div class="result-boxes">
      <div class="result-box win">Wins: <span id="winCount">0</span></div>
      <div class="result-box draw">Draws: <span id="drawCount">0</span></div>
      <div class="result-box loss">Losses: <span id="lossCount">0</span></div>
    </div>
    <div class="result-box total">
      Total League Points: <span id="pointsTotal">0</span>
    </div>
  </div>
</header>

<main>
  <div class="content-box">
    <h2>Fixtures</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th>Fixture</th>
          <th>Scores</th>
          <th class="points">Points</th>
          <th>Venue</th>
          <th>Competition</th>
          <th>Alley</th>
        </tr>
      </thead>
      <tbody id="fixturesBody"></tbody>
    </table>
  </div>
</main>

<footer>
  © Semington A Skittles Team
  <div class="footer-logo">
    <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
  </div>
</footer>
<script>
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQuotes && text[i + 1] === '"') {
        cur += '"'; i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      row.push(cur); cur = "";
    } else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (cur || row.length) {
        row.push(cur);
        rows.push(row);
        row = []; cur = "";
      }
    } else {
      cur += c;
    }
  }
  if (cur || row.length) {
    row.push(cur);
    rows.push(row);
  }
  return rows;
}

fetch("fixtures_web.csv?v=" + Date.now())
  .then(r => r.text())
  .then(text => {

    const rows = parseCSV(text);

    // ✅ Skip title + blank rows
    rows.shift();
    rows.shift();
    rows.shift();

    // ✅ Real header row
    const headers = rows.shift().map(h => h.trim());
    const idx = name => headers.indexOf(name);

    const tbody = document.getElementById("fixturesBody");
    let win = 0, draw = 0, loss = 0, totalPoints = 0;
    let latest = "";

    rows.forEach(row => {
      if (!row[idx("Date:")]) return;

      const comp = row[idx("Match Details")] || "";
      const tr = document.createElement("tr");

      if (/cup/i.test(comp)) tr.classList.add("cup-match");

      const p1 = row[idx("Points")] || "";
      const p2 = row[idx("Points") + 2] || "";

      let myPts = 0;
      if (/semington a/i.test(row[idx("Home Team")])) myPts = Number(p1) || 0;
      else if (/semington a/i.test(row[idx("Away Team")])) myPts = Number(p2) || 0;

      if (!/cup/i.test(comp)) {
        totalPoints += myPts;
        if (myPts > 3.5) { win++; tr.classList.add("_win"); }
        else if (myPts < 3.5) { loss++; tr.classList.add("_loss"); }
        else { draw++; tr.classList.add("_draw"); }
      }

      if (row[idx("UpdatedAt")] > latest) latest = row[idx("UpdatedAt")];

      tr.innerHTML = `
        <td>${row[idx("Date:")]}</td>
        <td>${row[idx("Day")]}</td>
        <td>${row[idx("Home Team")]} vs ${row[idx("Away Team")]}</td>
        <td>${row[idx("Score")] || ""}</td>
        <td class="points">${p1 && p2 ? `${p1}–${p2}` : ""}</td>
        <td>${row[idx("Location")]}</td>
        <td>${comp}</td>
        <td>${row[idx("Alley")] || ""}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("winCount").textContent = win;
    document.getElementById("drawCount").textContent = draw;
    document.getElementById("lossCount").textContent = loss;
    document.getElementById("pointsTotal").textContent = totalPoints.toFixed(1);

    if (latest) {
      const p = latest.split(" ")[0].split("/");
      const d = new Date(p[2], p[1]-1, p[0]);
      document.getElementById("lastUpdated").textContent =
        "Last updated: " +
        d.toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
    }
  });
</script>

</body>
</html>
