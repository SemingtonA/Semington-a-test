<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accounts (Private)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* NAV BUTTONS – SAME AS REST OF SITE */
    .nav-buttons {
      width: 100%;
      text-align: center;
      margin: 20px 0;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover {
      background: #163aa3;
    }

    /* CONTENT */
    .content-box {
      background: #fff;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    h2 { margin: 0; }

    #lastUpdated {
      font-size: 12px;
      color: #555;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #f0f0f0;
      text-align: left;
    }

    td.center { text-align: center; }
    td.num { text-align: right; white-space: nowrap; }
  </style>
</head>

<body>

<!-- PASSWORD GATE -->
<script>
const pw = prompt("Admin access – enter password:");
if (!pw || pw.trim().toLowerCase() !== "skittles2026") {
  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:50px'>Access denied</h2>";
}
</script>

<!-- NAV BUTTONS -->
<div class="nav-buttons">
  <a href="index.html">Home</a>
  <a href="fixtures.html">Fixtures &amp; Results</a>
  <a href="match-results.html">Match Results</a>
  <a href="tocatch.html">To Catch</a>
  <a href="gallery.html">Gallery</a>
  <a href="rules.html">Rules</a>
  <a href="accounts.html">Accounts (admin only)</a>
</div>

<!-- CONTENT -->
<div class="content-box">
  <div class="header-row">
    <h2>Accounts (Private)</h2>
    <div id="lastUpdated">Last updated: —</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th class="center">League Games</th>
        <th class="center">Cup Games</th>
        <th class="num">League Fees</th>
        <th class="num">Duck Fines</th>
        <th class="num">Low Score Fines</th>
        <th class="num">Total Fines</th>
        <th class="num">Net Owed</th>
      </tr>
    </thead>
    <tbody id="accountsBody"></tbody>
  </table>
</div>

<!-- DATA SCRIPT (FETCH CSV, SAME AS OTHER PAGES) -->
<script>
fetch("csv_export.csv?v=" + Date.now(), { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("csv_export.csv not found");
    return r.text();
  })
  .then(text => {
    const rows = text.trim().split(/\r?\n/).map(r => r.split(","));
    const header = rows.shift();

    const idx = n => header.indexOf(n);

    const iPlayer  = idx("Semington A Player Name");
    const iScore   = idx("Total Score");
    const iDucks   = idx("Ducks");
    const iDetails = idx("Match Details");
    const iMatchId = idx("Match ID");
    const iUpdated = idx("UpdatedAt");

    const players = {};
    const seen = {};
    let latest = "";

    rows.forEach(r => {
      const name = r[iPlayer];
      if (!name) return;

      if (r[iUpdated]) latest = r[iUpdated];
      const key = name + r[iMatchId];
      if (seen[key]) return;
      seen[key] = true;

      players[name] ||= { lg:0, cup:0, fees:0, duck:0, low:0 };

      if (/league/i.test(r[iDetails])) {
        players[name].lg++;
        players[name].fees += 4;
        if (+r[iDucks] > 0) players[name].duck += (+r[iDucks]) * 0.5;
        const score = Number(r[iScore]);
        if (!isNaN(score) && score <= 4) {
        players[name].low += 0.2;
       }
       } else if (/cup/i.test(r[iDetails])) {
        players[name].cup++;
      }
    });

    const body = document.getElementById("accountsBody");
    body.innerHTML = "";

    Object.keys(players).sort().forEach(n => {
      const p = players[n];
      const fines = p.duck + p.low;
      const owed = p.fees + fines;

      body.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${n}</td>
          <td class="center">${p.lg}</td>
          <td class="center">${p.cup}</td>
          <td class="num">£${p.fees.toFixed(2)}</td>
          <td class="num">£${p.duck.toFixed(2)}</td>
          <td class="num">£${p.low.toFixed(2)}</td>
          <td class="num">£${fines.toFixed(2)}</td>
          <td class="num"><strong>£${owed.toFixed(2)}</strong></td>
        </tr>
      `);
    });

    document.getElementById("lastUpdated").textContent =
      latest ? "Last updated: " + latest : "Last updated: —";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("lastUpdated").textContent =
      "Last updated: ERROR loading CSV";
  });
</script>

</body>
</html>
