<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====================== -->
  <!-- PAGE METADATA -->
  <!-- ====================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Catch Next Player Above</title>

  <style>
    /* ====================== */
    /* GLOBAL PAGE STYLES */
    /* ====================== */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f0e6;
    }

    /* ====================== */
    /* HEADER */
    /* ====================== */
    header {
      padding: 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 72px;
      text-align: center;
      flex: 1;
    }

    .logo img {
      width: 300px;
      height: auto;
    }

    /* ====================== */
    /* NAV BUTTONS */
    /* ====================== */
    .nav-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 6px;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-buttons a:hover {
      background: #163aa3;
    }

    /* ====================== */
    /* MAIN */
    /* ====================== */
    main {
      flex: 1;
      padding: 20px;
    }

    .panel {
      max-width: 1400px;
      margin: 10px auto 14px;
      background: #ffffffcc;
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
    }

    .table-wrap {
      max-width: 1400px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      border-bottom: 1px solid #eee;
      padding: 8px;
      white-space: normal;
      text-align: center;
      background: #fafafa;
    }

    td {
      border-bottom: 1px solid #eee;
      padding: 8px;
      white-space: nowrap;
      text-align: center;
    }

    td:nth-child(1), th:nth-child(1) {
      text-align: left;
    }

    /* ====================== */
    /* FOOTER */
    /* ====================== */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px 20px 22px;
      font-size: 12px;
      color: #555;
    }

    .footer-logo img {
      width: 60px;
      opacity: 0.9;
    }

    /* ====================== */
    /* MOBILE */
    /* ====================== */
    @media (max-width: 900px) {
      .header-top {
        flex-direction: column;
        text-align: center;
      }

      header h1 {
        font-size: 32px;
        margin-top: 10px;
      }

      .logo img {
        width: 150px;
        margin-bottom: 10px;
      }

      table {
        font-size: 12px;
      }

      .footer-logo img {
        width: 48px;
      }
    }
  </style>
</head>

<body>

  <!-- ====================== -->
  <!-- PAGE HEADER -->
  <!-- ====================== -->
  <header>
    <div class="header-top">
      <h1>To Catch Next Player Above</h1>

      <!-- TOP LOGO -->
      <div class="logo">
        <img src="Semington A Logo 5.jpg" alt="Semington A Logo">
      </div>
    </div>

    <!-- ====================== -->
    <!-- NAVIGATION (UPDATED PATHS) -->
    <!-- ====================== -->
    <div class="nav-buttons">
      <a href="/semington-a/index.html">Home</a>
      <a href="/semington-a/fixtures.html">Fixtures &amp; Results</a>
      <a href="/semington-a/match-results.html">Match Results</a>
      <a href="/semington-a/tocatch.html">To Catch</a>
      <a href="/semington-a/gallery.html">Gallery</a>
      <a href="/semington-a/rules.html">Rules</a>
    </div>
  </header>

  <!-- ====================== -->
  <!-- MAIN CONTENT -->
  <!-- ====================== -->
  <main>

    <!-- ====================== -->
    <!-- LAST UPDATED DISPLAY (NEW) -->
    <!-- Source: match_results.csv -->
    <!-- ====================== -->
    <div id="lastUpdated"
         style="text-align:center; font-size:12px; margin:0 0 12px; color:#555;">
      Last updated: —
    </div>

    <!-- ====================== -->
    <!-- FILTER PANEL -->
    <!-- ====================== -->
    <div class="panel">
      <div class="label">Filter by League Match (Cup matches excluded)</div>
      <select id="matchSelect">
        <option value="">Latest League Match</option>
      </select>
      <div id="status"></div>
    </div>

    <!-- ====================== -->
    <!-- TABLE -->
    <!-- ====================== -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Total Match Pins</th>
            <th>Games (to date)</th>
            <th>Avg</th>
            <th>Pins Behind Player Above</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </main>

  <!-- ====================== -->
  <!-- FOOTER -->
  <!-- ====================== -->
  <footer>
    © Semington A Skittles Team
    <div class="footer-logo">
      <img src="Semington A Logo 5.jpg" alt="Logo">
    </div>
  </footer>

  <!-- ====================== -->
  <!-- EXISTING TO CATCH LOGIC (UNCHANGED) -->
  <!-- This script already fetches match_results.csv -->
  <!-- ====================== -->
  <script src="/semington-a/tocatch.js"></script>

  <!-- ====================== -->
  <!-- LAST UPDATED SCRIPT (NEW) -->
  <!-- Reads UpdatedAt from match_results.csv (if present).
       Fallback: uses HTTP Last-Modified header if your host provides it. -->
  <!-- ====================== -->
  <script>
  (function () {

    fetch("match_results.csv", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("match_results.csv not found");

        // Fallback option: HTTP Last-Modified header (if provided by hosting)
        var headerLastMod = r.headers.get("Last-Modified");

        return r.text().then(function (text) {
          return { text: text, headerLastMod: headerLastMod };
        });
      })
      .then(function (payload) {
        var text = payload.text;
        var headerLastMod = payload.headerLastMod;

        var lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) {
          if (headerLastMod) {
            var el0 = document.getElementById("lastUpdated");
            if (el0) el0.textContent = "Last updated: " + headerLastMod;
          }
          return;
        }

        var headers = lines[0].split(",");
        var idx = headers.indexOf("UpdatedAt");
        if (idx === -1) idx = headers.indexOf("Updated At");

        // If UpdatedAt column exists, use it
        if (idx !== -1) {
          var latest = "";
          for (var i = 1; i < lines.length; i++) {
            var cells = lines[i].split(",");
            var val = cells[idx];
            if (val && val > latest) latest = val;
          }
          if (latest) {
            var el = document.getElementById("lastUpdated");
            if (el) el.textContent = "Last updated: " + latest;
            return;
          }
        }

        // Otherwise fall back to Last-Modified header
        if (headerLastMod) {
          var el2 = document.getElementById("lastUpdated");
          if (el2) el2.textContent = "Last updated: " + headerLastMod;
        }

      })
      .catch(function (err) {
        console.error("Last updated fetch failed:", err);
      });

  })();
  </script>

</body>
</html>
